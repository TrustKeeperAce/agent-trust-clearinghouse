name: Skyvern (open-source)
slug: skyvern
category: Browser/web agent
type: open source (AGPL-3.0), PyPI skyvern; Skyvern Cloud (hosted service) not covered
homepage: https://github.com/Skyvern-AI/skyvern
scope: The open-source Skyvern browser-automation agent (Skyvern 2.0 planner/validator design onward; PyPI 0.1.x to 1.0.56) run with a language model chosen by the user. Skyvern Cloud is not covered.
summary: Skyvern is an open-source browser-automation agent (AGPL-3.0) from Skyvern AI that uses language and vision models to fill forms and carry out web tasks; a hosted Skyvern Cloud service is also sold. Three independent evaluations were found, two January 2026 preprints by an overlapping Fudan University group, and a peer-reviewed prompt-injection study (ISSTA 2026) by KAIST, Seoul National University and Oregon State University. With GPT-4o, Skyvern completed 84.4% of 500 benign WebVoyager tasks. In the same study, 62.6% of social-engineering attacks succeeded on average. A separate security test scored it 61.67-72.29 (100 = no successful attacks); it was the lowest of four frameworks with GPT-4o. Skyvern's own results (85.85% on a modified WebVoyager set; Web Bench, which Skyvern co-built and ran on its own infrastructure) are not counted. Two template-injection vulnerabilities allowing code execution by authenticated or workflow inputs (CVE-2025-49619, CVE-2026-82447) were fixed in later releases. Informational only; not a guarantee, endorsement, or
  certification.
scores:
  completion_rate: 50
  disputes: 40
  adherence_to_limits: 30
  evidence_quality: 55
overall_score: 44
evidence_grade: B-
independent_source_count:
  performance: 3
  peer_reviewed: 1
  other: 4
factor_notes:
  completion_rate: '84.4% of 500 WebVoyager tasks with GPT-4o, no defence (Bots Take the Bait, automatic string checking); 80.2-83.2% with added defences. AgentBreaker: 33.3% task success on its 60-task Online-Mind2Web sample without attack (GPT-4.1).'
  disputes: 'No legal or regulatory action found. CVE-2025-49619 (server-side template injection in workflow prompt fields, Skyvern through 0.1.85; CVSS 3.1 8.5 from MITRE; fixed by commit db856cd; public exploit on Exploit-DB) and CVE-2026-82447 (Jinja sandbox escape in TextPromptBlock before 1.0.45; CVSS 3.1 8.8 / 4.0 8.7 from VulnCheck; fixed in 1.0.45). NVD status Deferred for both. No GitHub security advisories published by the project.'
  adherence_to_limits: 'Social-engineering attacks succeeded 62.6% on average (43-78% by context; Bots Take the Bait, GPT-4o). WebTrap Park security score 61.67 (GPT-4o), 70.44 (o3), 72.29 (Claude 4 Sonnet), where higher is safer; lowest of four frameworks with GPT-4o. AgentBreaker (ISSTA 2026; GPT-4.1, static copies of 60 Online-Mind2Web sites): adaptive indirect prompt-injection attacks succeeded 96.7% of the time on Skyvern; the authors'' proposed mitigations reduced this to low single digits.'
  evidence_quality: 'Three independent performance sources (one peer-reviewed, ISSTA 2026); two share authors (Fudan University). No source states the Skyvern version; tests ran between October 2025 and January 2026.'
sources:
- url: https://arxiv.org/abs/2601.07263
  kind: independent performance
  accessed: '2026-10-17'
  note: '"When Bots Take the Bait" (preprint, Jan 2026; Fudan University, Zhongguancun Lab, Tsinghua): with GPT-4o, Skyvern completed 84.4% of 500 benign WebVoyager tasks without defences (Browser Use 86.2%, Agent-E 84.0%). Social-engineering attack success averaged 62.6% (range 43-78% across inducement contexts; 49-76% across consistency patterns). Shares authors with WebTrap Park'
  version_tested: unstated (GPT-4o)
  test_date: unstated (preprint Jan 2026)
  peer_reviewed: false
- url: https://arxiv.org/abs/2601.08406
  kind: independent performance
  accessed: '2026-10-17'
  note: 'WebTrap Park (preprint, Jan 2026; Fudan University; 1,226 live-web security tasks; GitHub code accessed 11 Jan 2026): score = 1 - attack success rate. Skyvern 72.29 (Claude 4 Sonnet), 70.44 (o3), 61.67 (GPT-4o; lowest of four frameworks at that model). Sub-scores with GPT-4o: misuse 78.6, prompt injection 71.16, deceptive web design 35.25. Shares authors with Bots Take the Bait'
  version_tested: unstated
  test_date: 2026-01 (code accessed 11 Jan 2026)
  peer_reviewed: false
- url: https://doi.org/10.1145/3832165
  kind: independent performance
  accessed: '2026-10-19'
  note: 'AgentBreaker (Son et al.; KAIST, Seoul National University, Oregon State University; Proc. ACM Softw. Eng. 3, ISSTA 2026, Article ISSTA074; peer-reviewed): indirect prompt injection against five web agents with GPT-4.1 on static copies of 60 sites sampled from Online-Mind2Web. Adaptive attacks succeeded 96.7% of the time on Skyvern, averaged over four attack goals (100% on the other four agents); task success without attack 33.3% (28.3% with the authors'' defence); proposed mitigations reduced attack success to low single digits. Skyvern repository accessed 7 Oct 2025; no release stated'
  access_note: 'ACM page timed out on automated fetch; full text read from the authors'' copy'
  version_tested: unstated (GPT-4.1; GitHub code accessed 2025-10-07)
  test_date: unstated (code accessed 2025-10-07)
  peer_reviewed: true
- url: https://arxiv.org/abs/2606.20910
  kind: other
  accessed: '2026-10-17'
  note: '"Whose Agent Are You?" (preprint, June 2026; UMass Amherst): network and behavioural fingerprinting of six web agents; Skyvern (GPT-5-mini) uniquely identifiable by its TLS/HTTP2 fingerprint (17 TLS extensions). About detectability, not task performance'
- url: https://nvd.nist.gov/vuln/detail/CVE-2025-49619
  kind: other
  accessed: '2026-10-17'
  note: 'CVE-2025-49619: server-side template injection (Jinja2) in workflow block prompt fields, Skyvern through 0.1.85, authenticated users, blind remote code execution; CVSS 3.1 8.5 (MITRE); fix commit db856cd; NVD Deferred'
- url: https://nvd.nist.gov/vuln/detail/CVE-2026-82447
  kind: other
  accessed: '2026-10-17'
  note: 'CVE-2026-82447: Jinja sandbox escape in TextPromptBlock (prompt rendered twice, second time unsandboxed) before 1.0.45, via workflow parameters or upstream block output; CVSS 3.1 8.8 / 4.0 8.7 (VulnCheck); fixed in 1.0.45; NVD Deferred'
