uncertainties:
- Only one partly independent performance source (an unreviewed master's thesis using one customer's data).
- The thesis does not disclose the author's relationship to the studied organization or any funding.
- The product has changed since the 2021 Walmart pilot.
- Paywalled and teaching-case full texts were not reviewed.
- Vendor savings figures are vendor claims, not findings.
