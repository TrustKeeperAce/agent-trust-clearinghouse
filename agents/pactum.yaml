name: Pactum
slug: pactum
category: negotiation
type: commercial
homepage: https://pactum.com/
summary: Pactum is a commercial procurement-negotiation agent. Public evidence consists mainly of vendor materials, a 2022 Harvard Business Review case study co-written by Walmart executives and university researchers (64% supplier agreement in a pilot), and a 2026 master's thesis analysing 148 negotiations at one customer (64.9% agreement; about half of agreements included a discount, with a median discount of zero; suppliers rated the process more favourably than the outcome). We found fewer than three independent evaluations, so no overall score is given. Insufficient evidence. Informational only; not an endorsement or certification.
status: Insufficient evidence
