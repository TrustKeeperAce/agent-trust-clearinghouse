  evidence_quality: null
factor_notes:
  Completion rate: Agreement rates of 64% (customer-coauthored Walmart pilot) and 64.9% (2026 thesis, one customer); in the thesis, 50 of 148 negotiations expired.
  Disputes: No documented formal disputes were found.
  Adherence to limits: The vendor describes negotiation within buyer-set rules with a human final award; not independently tested.
  Evidence quality: Fewer than three independent evaluations; available evidence is vendor, customer-coauthored, a single unreviewed thesis, and secondary reporting.
