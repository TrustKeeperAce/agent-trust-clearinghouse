factor_notes:
  completion_rate: 'InfiAgent-DABench (independent re-runs): 75.78% GPT-4o, 67.70% GPT-4o-mini (DatawiseAgent); 54.09-67.70% pass@1 across four open models (DataMind); 0.716-0.788 with GPT-4o / DeepSeek-V3.1 / o4-mini (EvoDS), below a plain ReAct agent in each case. Developers report 94.93%. KramaBench: 0.256-0.382 (Fail Loudly), 30.34% with Gemini 2.5 Pro (Blackboard). Kaggle/OpenML tabular tasks: competitive, close to AIDE (SPIO). Execution stability 0.672-0.676 (VDSAgents). UrbanDS-Bench 3.3% overall.'
  disputes: 'Seven CVEs for MetaGPT. Data Interpreter components: CVE-2026-4516 (write_analysis_code.py, up to 0.8.1) and CVE-2026-19058 (data_interpreter.py, up to 0.8.2). Framework-wide: CVE-2026-0760 and CVE-2026-0761 (ZDI 0-day advisories after no vendor response), CVE-2024-23750, CVE-2026-19059 and CVE-2026-19060. VulDB records that the vendor did not respond for CVE-2026-4516. No GitHub security advisories published. Two independent papers report being unable to reproduce the headline DABench result. No legal or regulatory action found.'
  adherence_to_limits: 'Data Agents Under Attack (NTU, June 2026; DeepSeek-V3.2): mean attack success about 12.9% across 14 techniques (0-56%), the lowest of four open-source data agents. The authors attribute this to limited functionality (frequent failure to connect to the database), not stronger defence. When attacks did connect, Data Interpreter had the largest share of the most severe outcome level (BR4, 9.3%). By design it executes model-written code; no built-in sandbox is documented.'
  evidence_quality: Nine independent sources, two peer-reviewed (EMNLP 2025, ICLR 2026), several from 2026. Fewer than three peer-reviewed, so grade B rather than A (0025 clarification). Most sources are competing-agent papers (disclosed).
