name: FacTool (open-source)
slug: factool
category: Verification
type: research code (Apache-2.0), GAIR-NLP (Shanghai Jiao Tong University and others); runs with a language model and search API chosen by the user
homepage: https://github.com/GAIR-NLP/factool
scope: The open-source FacTool framework (GitHub GAIR-NLP/factool and PyPI factool 0.1.x, 2023; code unchanged since about October 2023), which splits text into claims, searches for evidence and labels each claim, with modes for knowledge-based QA, code, math and scientific literature review. Tests that run FacTool's pipeline with a different language model count as tests of FacTool. Results for a language model alone (0039), Halu-J, and reuse of FacTool's datasets or prompts are not covered.
summary: FacTool is open research code from GAIR-NLP that splits text into claims, searches the web for evidence and labels each claim true or false. Seventeen independent sources ran it (thirteen peer-reviewed), almost all as a comparison system in papers proposing alternative methods. On standard claim sets it labels true claims fairly well (F1 about 0.60-0.88) and false claims less well (about 0.46-0.64), and two studies report it as slower or costlier than newer checkers. One study found it overstated factual precision on long answers. The code has not changed since 2023; an unfixed medium-severity code-injection flaw (CVE-2025-4261) affects its math mode. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 50
  disputes: 55
  adherence_to_limits: 40
  evidence_quality: 75
overall_score: 55
evidence_grade: B
grade_note: 'Grade B: 17 counted sources (13 peer-reviewed), but no test within 12 months states the FacTool version or commit tested. The code has not changed since about October 2023, so recent tests very likely ran the only version; under the current rule a stated version is still required for A (see Decision 0084, D7).'
independent_source_count:
  performance: 17
  peer_reviewed: 13
  other: 10
factor_notes:
  completion_rate: 'Claim verification on FacTool-QA, Factcheck-Bench, FELM-WK and BingCheck: true-claim F1 about 0.60-0.88 and false-claim F1 about 0.46-0.64 across GPT-3.5, GPT-4o, GPT-4.1 and LLaMA backends (FIRE, Loki, EMULATE, Factcheck-Bench, OpenFactCheck). Usually below the authors'' new methods; ahead of FIRE in some settings (CoVer, LEAP). FaStFact found it overstated factual precision (0.987 against 0.792). Judgment call.'
  disputes: No legal or regulatory action found. CVE-2025-4261 (CVSS 4.0 4.8 Medium, local; code injection in the math mode) is unfixed, and the GitHub report has no maintainer reply. Judgment call.
  adherence_to_limits: The math mode runs model-generated code with exec() and no sandbox (CVE-2025-4261). The package pins an old OpenAI SDK (openai 0.27.8, 2023) and a user reports the bundled example failing (2024). Two studies report higher cost or latency than newer checkers ($24.76 against $3.35 model cost in FIRE; 12.38 against 8.32 seconds per sample in Loki). Judgment call.
  evidence_quality: Seventeen independent sources, thirteen peer-reviewed (EMNLP, NAACL, ACL, COLING, AAAI, SIGIR-AP, LNCS, FEVER workshop). Nearly all are comparison baselines in papers proposing alternative methods; five come from one connected MBZUAI group that shares result rows; three test only the verification step and several apply it outside its original tasks; no study states a version. Judgment call.
uncertainties:
- Nearly every counted study proposes a competing method and reports FacTool as a baseline.
- Five counted studies come from one connected group of MBZUAI-affiliated authors (Factcheck-Bench, OpenFactCheck, Loki, FIRE, UrduFactCheck); some reuse each other's FacTool rows, so they are not independent samples.
- Studies use different language models (GPT-3.5 to GPT-4.1, LLaMA, Qwen) and search settings; figures describe FacTool with that model.
- Three counted studies test only the verification step (Factcheck-Bench, OpenFactCheck, REVEAL); others apply FacTool outside its original tasks (summaries in FIZZ, agent trajectories in Phantom Merge, Urdu translations in UrduFactCheck, mitigation in Rowen).
- No study states a FacTool version or commit; the code has not changed since about October 2023, so this is the only version.
- One study with a FacTool author (Knowledge-Centric Hallucination Detection / RefChecker) is excluded under 0031.
- Citation check incomplete — recheck later (OpenAlex full text used; Semantic Scholar rate-limited and the arXiv API unreliable; 29 citing works could not be downloaded).
