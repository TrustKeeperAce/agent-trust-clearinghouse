name: Google DeepMind SAFE (Search-Augmented Factuality Evaluator)
slug: google-deepmind-safe
category: verification
type: research code (Apache-2.0 code; CC-BY other materials; bundled FActScore code MIT)
homepage: https://github.com/google-deepmind/long-form-factuality
summary: SAFE (Search-Augmented Factuality Evaluator) is open research code from Google DeepMind, described in a NeurIPS 2024 paper, that uses a language model and Google Search results to rate individual facts in long-form text. The authors report 72% agreement with crowdsourced annotators. Independent peer-reviewed studies report agreement with human annotators of about 84% on biography facts and strong correlation on factual labels, alongside weaker results for its claim extraction; these studies were conducted by researchers proposing alternative methods. Commentators have questioned the authors' comparison with crowdworkers rather than expert fact-checkers. Overall score 66. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 65
  disputes: 80
  adherence_to_limits: 60
  evidence_quality: 60
factor_notes:
  completion_rate: Independent agreement and correlation are good on factual labels (84.48% on 786 biography facts, Zhao et al.; response-level Pearson 0.95, FactBench), weaker on other labels (0.60) and for claim extraction (VeriScore). Judgment call.
  disputes: No legal or regulatory disputes found. Public critique of the "superhuman" framing (comparison with crowdworkers, not expert fact-checkers). Judgment call.
  adherence_to_limits: Clear licences and stated limitations; maintained research code. Independently measured cost ($0.49 per response) is higher than the authors' $0.19, though setups differ. Judgment call.
  evidence_quality: Three peer-reviewed independent sources, but small samples, mainly biographies and chat prompts, and each study promotes its own alternative method. Judgment call.
overall_score: 66
overall_note: 0.30*65 + 0.20*80 + 0.25*60 + 0.25*60 = 65.5; exact .5 rounds up (Decision 0010)
evidence_grade: B-
