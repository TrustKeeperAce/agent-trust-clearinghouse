uncertainties:
- No independent benchmark of Claygent's accuracy was found.
- Practitioner tests are small and self-published, use differing methods, and one grades against Clay's own output.
- Claygent's available models change frequently, so test results may age quickly.
- Vendor accuracy figures are vendor claims, not findings.
- User-review aggregates are anecdotal; Trustpilot's sample is small and its page could not be fetched automatically.
- 'Citation check still incomplete (Decision 0080, 19 Oct 2026): an OpenAlex full-text search for "Claygent" found one passing mention and no test; Semantic Scholar was unavailable (rate-limited). Recheck later.'
- Two tests published by competing vendors (Sixtyfour, SyncGTM) report Clay figures; they are listed but not counted.
