summary: Clay is a commercial data-enrichment platform; this entry covers its AI research agent (Claygent) and enrichment features. Public evidence consists mainly of vendor materials, including internal benchmarks, plus small self-published practitioner tests and user-review aggregates. We found no independent benchmark of Claygent's accuracy, so no overall score is given. Insufficient evidence. Informational only; not an endorsement or certification.
