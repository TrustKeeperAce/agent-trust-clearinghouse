  kind: not counted (paid by vendor)
  accessed: '2026-10-17'
  note: 'Trail of Bits audit commissioned and paid for by Perplexity (April 2025, before launch): four prompt-injection techniques exfiltrated Gmail data; Perplexity says the gaps were fixed. Not independent'
- url: https://arxiv.org/abs/2511.20597
  kind: vendor or maintainer
