name: Manus
slug: manus
category: Research
type: commercial (free tier with credits; paid plans)
homepage: https://manus.im/
scope: Manus, a general-purpose AI agent from Butterfly Effect for research and multi-step digital tasks. The current product is Manus 2.0 (28 September 2026), which the vendor describes as a new architecture.
summary: Manus is a commercial general-purpose AI agent used for research reports and multi-step digital tasks. Meta agreed to acquire it in December 2025; Chinese regulators ordered the deal unwound in 2026, some user data was deleted in August 2026 to comply with regulatory requirements, and Manus resumed independent operation in September 2026. Manus 2.0 (28 September 2026, new architecture) has not been independently tested, so no overall score is given. Independent tests of 2025 versions are listed as historical context only. Insufficient evidence. Informational only; not a guarantee, endorsement, or certification.
status: Insufficient evidence
scores:
  completion_rate: null
  disputes: null
  adherence_to_limits: null
  evidence_quality: null
factor_notes:
  completion_rate: 'No independent test of Manus 2.0 was found. 2025 versions, for reference only (not counted): research-report quality mid-range with weak citation accuracy (LiveResearchBench citation 45.6; DeepResearchEval quality 5.95/10, 8th of 9, factual ratio 82.3%, 1st of 9); 8.0% full success on CAP cross-site tasks (best agent tested; humans 10%); fabricated all 10 selected studies in a systematic-review test; 92–95% accuracy on dental diagnosis questions and radiographs.'
  disputes: Researchers demonstrated prompt injection exposing a VS Code server (Embrace The Red, 2025) and a single email leading to remote code execution and exposure of connected-account tokens (Salt Labs, 2026; fixed via Meta's bug bounty). Chinese regulators ordered Meta's acquisition unwound, and some user data was deleted in August 2026 to comply with regulatory requirements.
  adherence_to_limits: In both security demonstrations, Manus followed instructions hidden in content it processed. Not independently tested for Manus 2.0.
  evidence_quality: Zero independent performance sources for Manus 2.0. Six tests of 2025 versions (five peer-reviewed) are listed but not counted.
overall_score: null
evidence_grade: Insufficient evidence
independent_source_count:
  performance: 0
  other: 4
  count_note: 6 performance tests of 2025 versions listed as historical context, not counted. Evidence pass 0071 (2026-10-18) found no independent test of Manus 2.0.
