name: Gemini CLI (open-source)
slug: gemini-cli
category: Coding agent
type: Open-source (Apache-2.0) terminal coding agent from Google, run with Google's Gemini models (other models only through third-party adapters); GitHub google-gemini/gemini-cli, npm @google/gemini-cli
homepage: https://github.com/google-gemini/gemini-cli
scope: Gemini CLI from the google-gemini/gemini-cli repository, from its initial release (v0.1.0, June 2025) through 0.65.0 (20 October 2026), in interactive and headless (non-interactive) use, run with any model. Advisories for the run-gemini-cli GitHub Action are described where they also affect Gemini CLI. Google Jules (a separate product with its own entry), Gemini Code Assist agent mode in IDEs, other Google agents, systems that use Gemini CLI as one part of a larger agent, and results for Gemini models alone are not covered.
summary: 'Gemini CLI is Google''s open-source coding agent for the terminal, normally run with Gemini models. 28 independent studies that ran it were counted, 8 of them peer-reviewed (including ICLR, ISSTA, AAAI and ASE 2026), and 18 state the version tested, from 0.6.1 (2025) to 0.61.0 (October 2026). Task results were mixed: with the same model, Gemini CLI was level with or above some other harnesses and well below others. Many counted studies attacked Gemini CLI, and planted instructions often succeeded; several found it more exposed than other harnesses tested. Google fixed a prompt-injection flaw found by Tracebit in v0.1.14 (July 2025) and two 2026 flaws in 0.39.1 (CVE-2026-12537, critical by Google''s score, and CVE-2026-13745); for the second, Google issued a CVE only after the reporter disputed its refusal. The A grade rests on a single peer-reviewed study that states a recent version (v0.27.3), published in a lower-assurance education journal; without it the entry would be graded B with an overall score of 51. Studies by Google authors are not counted. Informational only; not a guarantee, endorsement, or certification.'
scores:
  completion_rate: 45
  disputes: 45
  adherence_to_limits: 35
  evidence_quality: 85
overall_score: 53
evidence_grade: A
grade_note: 'Grade A: 28 counted sources (8 peer-reviewed) and versioned tests within the last 12 months. The A grade rests on a single lower-assurance study: the only peer-reviewed test that states a recent version is the IJLTER study (v0.27.3, run February 2026), published in an education journal with lower assurance for software claims. Of the other peer-reviewed tests, one states an older version (0.9.0, October 2025, test date not given) and the rest state none. Without the IJLTER study the entry would be graded B, with an overall score of 51. Preprints tested versions up to v0.61.0 (October 2026). Results reflect the model and the harness together (see Decision 0087, D3); most studies ran Gemini CLI with Gemini models (see Decision 0094, D3).'
independent_source_count:
  performance: 28
  peer_reviewed: 8
  other: 13
factor_notes:
  completion_rate: Mixed. With the same model, Gemini CLI was level with or above other harnesses on TerminalWorld (56.0% against 55.0% for Terminus-2), FeatureBench (ICLR 2026; 10.0% and 5.0% resolved against 10.0% and 4.5% for OpenHands, with fewer tokens) and SkillsBench (60.8% with skills against 52.8% for OpenHands), but well below on Terminal-Bench 2.0 (ICLR 2026; 19.6% against 32.6% for Terminus 2 with Gemini 2.5 Pro). Against other vendors' agents with their own models it trailed on multi-hunk repair (43.07% against 87–93%) and was mixed on LLVM optimizations (most profitable patches, least behaviorally valid). As a baseline in peer-reviewed method papers it produced compilable tests 54.6–60.9% of the time (ISSTA 2026) and correct GPU kernels for 22–51% of tasks (AAAI-26). In a thematic-analysis study its runs were the least reproducible of three tools.
  disputes: 'Google fixed the reported flaws, some quickly, but disclosure handling was uneven. Tracebit''s prompt-injection finding (June 2025) was initially triaged as low priority, then raised to the highest priority and fixed in v0.1.14 about four weeks after the report, three days before disclosure; no CVE was assigned. CVE-2026-12537 (critical by Google''s CVSS 4.0 score of 10.0; NVD 7.8): headless mode skipped the workspace trust check and --yolo ignored tool allowlists, fixed in 0.39.1 and run-gemini-cli 0.1.22; Pillar Security reports a patch within two days of its report and thanks Google. CVE-2026-13745 (high, 7.7): a .env file could bypass folder trust, fixed in 0.39.1; according to the reporter, Google paid a bounty but twice declined to issue a CVE until a dispute with MITRE, and the record was published with errors and later corrected. Cyera reported two command-injection flaws, fixed through Google''s reward program. A widely reported July 2025 ''deleted files'' incident was withdrawn by the user, who found the files elsewhere on the drive. No lawsuit or regulatory action concerning Gemini CLI was found.'
  adherence_to_limits: 'Weak in many security studies, several of which compared harnesses directly. Planted instructions often succeeded: file and email exfiltration through malicious MCP servers in 90–100% of trials (Electronics 2026), risky third-party skills executed in 26.62–52.85% of cases (higher than Claude Code and Codex), 7 of 13 role-confusion attacks against 0 of 13 for Claude Code and Codex, cross-session attacks in 59.3–75.9%, misgrounded actions in 75.3–85.8% of cases, and hallucinated repository names an attacker could register in 82% of valid runs. Earlier approvals widened silently (0.84 of gated actions after 64 tasks, against about 0.1 for Codex and OpenCode). On the other side, its folder-trust setting blocked every attack in one study (by refusing to start), it refused remote scripts in a peer-reviewed MCP study, and it overreached on benign tasks less often than Claude Code (10.0–13.1% against 11.8–27.7%).'
  evidence_quality: '28 counted independent sources, 8 peer-reviewed (two ICLR 2026, ISSTA 2026, AAAI-26, two MDPI journals, IJLTER and an ASE 2026 extended abstract). Versions are stated in 18, from 0.6.1 (2025) to 0.61.0 (October 2026). Strengths: several same-model comparisons and many security studies with stated versions. Limits: most counted sources are 2026 preprints; most studies use Gemini models, so results mix the model and the harness; 12 are attack studies, often with confirmations off; only one peer-reviewed test states a version; two counted preprints share authors; one journal is lower-assurance. Studies by Google authors, studies whose authors'' own coding product is compared and Google''s own material are not counted.'
uncertainties:
- Results reflect the model and the harness together; most studies ran Gemini CLI with Gemini models, so differences may come from either.
- Gemini CLI releases weekly (0.65.0 on 20 October 2026); no counted test names a version after 0.61.0, and security behaviour such as folder trust changed across versions.
- 12 of the 28 counted studies are attack studies, often run with confirmations off or in headless mode; they describe Gemini CLI under attack, not in everyday use.
- The Tracebit flaw (fixed in v0.1.14) has no CVE, and the two 2026 CVEs have different severity scores from Google and from NVD.
- Google Jules and Gemini Code Assist agent mode are separate products; results for them are not counted here.
- 'Citation check incomplete — recheck later (OpenAlex full text: 457 works screened and 341 arXiv texts read; Semantic Scholar and the arXiv API were not used; one MSR 2026 paper could not be retrieved, and more studies that ran Gemini CLI were found than were reviewed).'
