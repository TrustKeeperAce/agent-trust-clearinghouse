  note: 'CVE-2026-12537 / GHSA-wpqr-6v78-jr5g (critical, CNA CVSS 4.0 score 10.0; NVD 7.8; published 24 April 2026): in headless mode Gemini CLI skipped the workspace trust check, so a planted .gemini/.env could run code on the host before the sandbox started, and --yolo ignored tool allowlists. Affects Gemini CLI before 0.39.1 and 0.40.0-preview.2 and the run-gemini-cli GitHub Action before 0.1.22; fixed in 0.39.1, 0.40.0-preview.3 and 0.1.22. Credited to Elad Meged (Novee Security) and Devansh Batham; Pillar Security''s report is covered by the same fix'
