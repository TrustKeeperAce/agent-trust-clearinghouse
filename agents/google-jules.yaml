name: Google Jules
slug: google-jules
category: Coding agent
type: Google's asynchronous coding agent (Google Labs) that works on a connected GitHub repository in a cloud virtual machine and returns its changes as a branch or pull request, through the Jules web app, its command-line interface (Jules Tools) or the Jules API
homepage: https://jules.google
scope: 'Google Jules, the hosted coding agent at jules.google that plans a task, edits code and runs commands in a cloud virtual machine and publishes the result to GitHub as a branch or pull request (by default from the google-labs-jules[bot] account): the public beta from 19 May 2025, general availability from 6 August 2025 (Gemini 2.5 Pro), and later updates including Gemini 3 Pro (November 2025), Gemini 3 Flash as the base model (January 2026) and Gemini 3.1 Pro for Pro-plan users (March 2026), whether a task is started in the web app, from a GitHub issue label, with the Jules Tools command-line interface or through the Jules API. The December 2024 research configuration that Google benchmarked on a SWE-bench subset, other Google coding products (Gemini CLI, Gemini Code Assist including its pull-request reviewer, Google Antigravity, Firebase Studio, AlphaEvolve) and results for Gemini models alone are not covered.'
summary: 'Google Jules is Google''s asynchronous coding agent: it works on a GitHub repository in a cloud virtual machine and returns its changes as a pull request. It entered public beta in May 2025 and left beta in August 2025. Three independent sources that measured it were found, none peer-reviewed: two studies of pull requests in a public dataset of agent activity on GitHub (one in a journal whose review process could not be confirmed) and a newsletter report that gave 15 coding tools the same build task. None names the Jules version, and all predate the Gemini 3 updates, so the current version has not been independently tested. The score rests on the minimum of three counted sources. In May 2025 an independent security researcher showed that instructions hidden in a web page or GitHub issue could make Jules leak data and run downloaded malware; he reported this to Google, which, according to him, closed the report as an issue it was already tracking. No CVE, lawsuit or regulatory action concerning Jules was found. Informational only; not a guarantee, endorsement, or certification.'
scores:
  completion_rate: 50
  disputes: 55
  adherence_to_limits: 40
  evidence_quality: 55
overall_score: 50
evidence_grade: B-
grade_note: 'Grade B-: this score rests on three counted sources, the minimum needed for a score, and none of them is peer-reviewed. If any one of the three were not counted, the entry would not have enough evidence to be scored. No counted test names the version of Jules it used. Their data come from May to October 2025, so Jules as it has worked since the move to Gemini 3 models in November 2025 has not been independently tested. Two of the three use the same public dataset of pull requests (AIDev), one is in a journal whose review process could not be confirmed, and one is a single build per tool scored with help from an AI code reviewer. A peer-reviewed study with a GitHub co-author that compares Jules with GitHub Copilot is listed but not counted, because GitHub makes Copilot (see Decision 0092).'
independent_source_count:
  performance: 3
  peer_reviewed: 0
  other: 15
factor_notes:
  completion_rate: 'No counted source reports a task success rate. Merged, Not Measured (pull requests up to 24 October 2025): 11 of 15 closed Jules performance fixes (73%) were merged, the same share as OpenAI Codex and Claude Code and above GitHub Copilot, Cursor and Devin, but the Jules sample is small. AI Coding Agents on GitHub (same dataset): 88.74% of 43,600 decided Jules pull requests were merged, second of six agents, but 76.4% went to unstarred repositories, where merge rates are highest, and Jules''s rate fell 16.6 points across popularity bands. In a June 2025 newsletter test of 15 tools given the same build task, Jules''s app scored 21 of 25, level with GitHub Copilot''s coding agent and below three tools at 24. Merge rates show acceptance by maintainers, not whether a task was done correctly.'
  disputes: No CVE or GitHub security advisory for Jules was found (NVD and GitHub, 20 October 2026; the NVD records matching 'jules' concern WordPress plugins by a developer of that name). No lawsuit or regulatory action concerning Jules was found. Independent researcher Johann Rehberger (Embrace The Red) reported data-leak and remote-control weaknesses to Google on 21 May and 1 June 2025 and published them on 13 to 15 August 2025; he writes that Google closed the second report on 13 June 2025 as something it was already tracking and did not answer questions about a mitigation timeline. No public statement from Google on a fix was found.
  adherence_to_limits: 'In the researcher''s May 2025 demonstrations, instructions planted in a web page or GitHub issue hijacked Jules: it sent file contents to an outside server before any plan was approved, downloaded and ran command-and-control malware after its plan was auto-approved (after 30 seconds, later two minutes), and followed hidden Unicode instructions to add a backdoor. Its virtual machine had unrestricted outbound internet access, and the Jules FAQ still describes a virtual machine ''with internet access''. These are single-researcher demonstrations, not rates. Jules proposes a plan before acting, and in Merged, Not Measured every recorded merge of a Jules pull request was made by someone other than the agent''s account. Single-user reports from the May–June 2025 beta describe tasks that ignored or misread instructions; they are not counted.'
  evidence_quality: 'Three independent sources, none peer-reviewed: a preprint (Merged, Not Measured, September 2026), a study in a journal whose review process could not be confirmed (IJRASET, September 2026) and a newsletter report (June 2025). None states the Jules version; their data run from May to October 2025. Two use the AIDev dataset of agent pull requests, the Jules part of one is small (17 fixes), and the newsletter test is a single build per tool scored with help from an AI code reviewer. A peer-reviewed MSR 2026 study with a GitHub co-author is listed as a competitor source; Google''s own reports and benchmark results are not counted.'
uncertainties:
- No counted test names the version or model of Jules it used; their data come from the beta and the Gemini 2.5 Pro period (May to October 2025). The Gemini 3 models and the features added since November 2025 are untested.
- Merge rates measure whether maintainers accepted a pull request, not whether the task was done correctly; they also depend on how much human review happens and on repository popularity, and most Jules pull requests went to unstarred repositories.
- According to the AIDev maintainers, pull requests from the Jules bot account fell about fifteen-fold after late January 2026. Since February 2026 Jules can also commit under the user's own name, which may make later activity harder to identify.
- The prompt-injection findings are one researcher's demonstrations from May 2025; whether Google has since changed this behaviour was not established.
- 'The score rests on the minimum of three counted sources: if any one of them were not counted, the entry would not have enough evidence to be scored. Two of the three use the same dataset (AIDev v4).'
- 'Citation check incomplete — recheck later (OpenAlex full text: 368 works matched and 210 downloaded; arXiv abstract search only; Semantic Scholar was not available).'
sources:
- url: https://arxiv.org/abs/2609.37985
  kind: independent performance
  peer_reviewed: false
  version_tested: unstated (pull requests from 19 May to 24 October 2025)
  test_date: May–October 2025
  accessed: '2026-10-20'
  note: 'Merged, Not Measured (Qi, Li, Chen and others; University of Arizona, Wuhan University and others; preprint, September 2026): 1,262 performance fixes by six agents in the AIDev v4 dataset (pull requests in repositories with more than 100 stargazers, up to 24 October 2025). Jules opened 17 of them; of its 15 closed fixes in 6 repositories, 11 (73%) were merged, the same share as OpenAI Codex and Claude Code and above GitHub Copilot (50%), Cursor (42%) and Devin (30%). Jules pull requests come from a bot account, and someone else merged them in every case where the merger is recorded. Small Jules sample. The authors declare no conflict of interest. Field study'
- url: https://doi.org/10.22214/ijraset.2026.84804
  kind: independent performance
  peer_reviewed: false
  version_tested: unstated (pull requests from 19 May to 24 October 2025)
  test_date: May–October 2025
  accessed: '2026-10-20'
  note: 'AI Coding Agents on GitHub: Repository Popularity as a Hidden Confounder (Bhavnagri, Wilson College, University of Mumbai; IJRASET 14(IX), September 2026): all 2,743,854 pull requests by six agents in AIDev v4 (24 December 2024 to 24 October 2025). Jules: 38,691 of 43,600 decided pull requests merged (88.74%; OpenAI Codex 93.20%, Claude Code 87.84%, Cursor 80.39%, GitHub Copilot 77.63%, Devin 69.74%); 76.4% of Jules pull requests went to unstarred repositories and 0.95% to repositories with 100 or more stargazers, and its merge rate fell 16.6 points across the four popularity bands with enough data. Holding the repository fixed halved the pooled Cursor–Jules difference (odds ratio 2.063 to 1.370, 101 repositories). Limited: a journal whose review process could not be confirmed (counted as not peer-reviewed, as in Decision 0076). Field study'
- url: https://labs.thefocus.ai/reports/june-2025-coding-agents.pdf
  kind: independent performance
  peer_reviewed: false
  version_tested: unstated (public beta)
  test_date: early June 2025
  accessed: '2026-10-20'
  note: 'June 2025 Coding Agent Report (Will Schenk, TheFocus.AI, for the Turing Post newsletter, 5 June 2025): 15 coding tools each given the same prompt to build a small Node.js web app with Docker and unit tests in an empty repository, with plans accepted without review; outputs built and run by hand and scored on five 1–5 criteria with help from an AI code review (Claude Sonnet). Jules scored 21 of 25 (code 4, testing 5, tooling 4, documentation 4, professionalism 4), level with GitHub Copilot''s coding agent and below Cursor''s background agent, v0 and Warp (24 each). One build per tool; the generated repository is public (github.com/The-Focus-AI/idears-jules). No funding disclosed'
- url: https://embracethered.com/blog/posts/2025/google-jules-vulnerable-to-data-exfiltration-issues/
  kind: other
  accessed: '2026-10-20'
  note: 'Embrace The Red (Johann Rehberger, independent security researcher), 13 August 2025: in May 2025 tests, instructions planted in a web page or GitHub issue made Jules send data to an outside server through Markdown image rendering and its view_text_website tool, before any plan was approved; plans were auto-approved after a delay (30 seconds, later two minutes). Disclosed to Google on 21 May 2025; at publication the researcher had not heard back on the latest status. Security research, no rate'
- url: https://embracethered.com/blog/posts/2025/google-jules-remote-code-execution-zombai/
  kind: other
  accessed: '2026-10-20'
  note: 'Embrace The Red, 14 August 2025: a prompt injection in a GitHub issue led Jules to download and run Sliver command-and-control malware after its plan was auto-approved; Jules had ''unrestricted outbound Internet connectivity''. Shared with Google on 1 June 2025; per the researcher, triaged as an abuse risk and closed on 13 June 2025 as something the team was already tracking, with no answer on a mitigation timeline'
- url: https://embracethered.com/blog/posts/2025/google-jules-invisible-prompt-injection/
  kind: other
  accessed: '2026-10-20'
  note: 'Embrace The Red, 15 August 2025: hidden Unicode tag characters in a GitHub issue were followed as instructions, and Jules added and ran backdoor code after an auto-approved plan; the researcher notes hidden text is ''not always 100% picked up''. Security research, no rate'
- url: https://huggingface.co/datasets/hao-li/AIDev-7.6M
  kind: other
  accessed: '2026-10-20'
  note: 'AIDev v5 dataset card (Li, Zhang and Hassan, Queen''s University; cutoff 31 March 2026): 296,411 Jules pull requests in 41,125 repositories, 63.4% merged, 21.0% open, 15.6% closed unmerged; the maintainers note that pull requests from google-labs-jules[bot] fell about fifteen-fold after late January 2026 and checked against GitHub that this is a real change. Dataset statistics, not a study'
- url: https://insights.logicstar.ai/
  kind: other
  accessed: '2026-10-20'
  note: 'Agents in the Wild dashboard (Mürtz and Müller, LogicStar AI; accessed 20 October 2026): 1,638,208 Jules pull requests opened since 15 May 2025; 965,607 of 1,225,005 closed were merged (78.82%). The dashboard warns that merge rates depend on how much human approval is involved and should be used with caution as a measure of quality. LogicStar develops its own code agent, which is not in the table. Live usage dashboard'
- url: https://prarena.ai/
  kind: other
  accessed: '2026-10-20'
  note: 'PR Arena dashboard (by GitHub user aavetis; updated 20 October 2026): Jules 205,695 merged of 243,419 ready (non-draft) pull requests (84.5%), 333,755 in all. Operator affiliation not stated, and one agent shows a success rate above 100%, so data quality could not be established. Live usage dashboard'
- url: https://doi.org/10.1145/3793302.3793354
  kind: competitor
  accessed: '2026-10-20'
  note: 'Investigating Autonomous Agent Contributions in the Wild (Popescu, Gros, Botocan, Pandita, Devanbu and Izadi; TU Delft, UC Davis and GitHub; MSR 2026, peer-reviewed; arXiv 2604.00917): about 110,000 pull requests from June to August 2025, including about 18,500 from Jules, compared with Codex, Claude Code, GitHub Copilot and Devin; Jules''s merge rate was fairly flat but fell in the most popular repositories, and its merged pull requests were merged quickly, like Codex''s. One author is from GitHub, which makes Copilot, and Copilot is in the comparison, so it is listed but not counted (competitor rule, Decisions 0080 and 0083)'
- url: https://arxiv.org/abs/2610.15567
  kind: other
  accessed: '2026-10-20'
  note: 'Reviewing Beyond the Change (Farrag, University of East London; preprint, October 2026): study of review comments on agent and human pull requests; 18.2% of comments on Jules pull requests came from the person who set the agent to work and 3.4% were addressed to the agent. Measures reviewer behaviour, not the agent''s results'
- url: https://arxiv.org/abs/2610.12849
  kind: other
  accessed: '2026-10-20'
  note: 'Co-Modifying Application Code and Deployment Infrastructure (Soualhi and Suleiman; preprint, October 2026): 3 of 27 Jules pull requests in AIDev v5 (June–July 2025) and 1 of 26 in MOSAIC-3M changed both application code and deployment files; integration effects are pooled across agents. Prevalence only'
- url: https://arxiv.org/abs/2608.21311
  kind: other
  accessed: '2026-10-20'
  note: 'AI-to-AI Code Reviews of GitHub Pull Requests (Selvanayagam and Ghaleb; ESEM 2026 emerging results): Jules authors pull requests but has no reviewer activity, and Jules pull requests were reviewed almost entirely by other companies'' review bots. Descriptive; no measure of Jules''s results'
- url: https://arxiv.org/abs/2606.24429
  kind: other
  accessed: '2026-10-20'
  note: 'Detecting AI Coding Agents in Open Source (Khosravani and Mockus; preprint, June 2026): census of agent activity; Jules reached 209,911 commits across 16,924 projects by October 2025 and 215,804 commits by April 2026, with activity peaking in August 2025. Measures usage, not results'
- url: https://arxiv.org/abs/2610.07639
  kind: other
  accessed: '2026-10-20'
  note: 'HarnessSecurity-Bench (Sun Yat-sen University and others; preprint, October 2026): Google Jules is one of 40 harnesses whose security mechanisms were assessed from public documentation; most of its cells are marked unknown, part of the evidence gaps the authors report for closed-source tools. Jules was not in the runtime benchmark'
