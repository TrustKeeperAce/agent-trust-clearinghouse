name: Perplexity
slug: perplexity
category: verification
type: commercial
homepage: https://www.perplexity.ai/
scope: Citation-backed answering and source attribution only; not a general product review.
scope_note: 'The Comet browser and its agent are covered by a separate entry: Perplexity Comet (agents/perplexity-comet.html).'
summary: 'Perplexity is a commercial AI answer engine; this entry covers only its citation and source-attribution behavior. In independent evaluations (CJR Tow Center, 2025; Findings of EMNLP 2023; DeepResearch Bench, ICLR 2026; DeepResearchGym, ICTIR 2026; Deep Research Comparator, WWW 2026 Companion; Mind2Web 2, NeurIPS 2025), results varied by product mode: its Deep Research mode scored comparatively high on citation accuracy, while news-attribution tests found a share of incorrect or syndicated citations. Several publishers have filed copyright lawsuits against Perplexity that are pending; these are allegations, not findings. Informational only; not a guarantee, endorsement, or certification.'
scores:
  completion_rate: 55
  disputes: 35
  adherence_to_limits: 45
  evidence_quality: 75
factor_notes:
  completion_rate: In CJR's news-attribution test, 37% of answers were incorrect (the lowest error rate of 8 tools tested); Mind2Web 2 success rates were 8% (Pro Search) and 15% (Deep Research). Judgment call.
  disputes: Several publishers have filed copyright lawsuits that are pending (allegations, not findings); CJR also reported attribution to syndicated copies. Judgment call.
  adherence_to_limits: CJR's results suggest, in CJR's words, that Perplexity 'may have disregarded' one publisher's robots.txt preferences; Perplexity states it respects robots.txt. Vendor plan-limit descriptions appeared inconsistent. Judgment call.
  evidence_quality: Six independent performance sources (five in peer-reviewed venues, plus CJR), covering different product modes and dates (2023–2025). Judgment call.
overall_score: 54
overall_note: 0.30*55 + 0.20*35 + 0.25*45 + 0.25*75 = 53.5; exact .5 rounds up (Decision 0010)
evidence_grade: B
independent_source_count:
  performance: 6
  other: 3
  count_note: 'Other: 3 court records.'
legal_disputes:
- Dow Jones & Co. and NYP Holdings filed suit (S.D.N.Y. 1:24-cv-07984), alleging copyright infringement, false designation of origin and trademark dilution. The court denied Perplexity's motion to dismiss or transfer on 2025-08-21; the case is pending.
- Encyclopaedia Britannica and Merriam-Webster filed suit on 2025-09-10 (S.D.N.Y. 1:25-cv-07546), alleging copyright infringement; the case is pending.
- Chicago Tribune Company filed suit on 2025-12-04, and The New York Times Company filed suit on 2025-12-05 (S.D.N.Y. 1:25-cv-10106), alleging copyright infringement; both are pending.
