name: Gemini Deep Research
slug: gemini-deep-research
category: research
type: commercial
homepage: https://gemini.google/overview/deep-research/
summary: Gemini Deep Research is a Google feature, in the Gemini app and as a Gemini API agent, that plans multi-step web research and writes cited reports. In independent evaluations (DeepResearch Bench, ICLR 2026; Mind2Web 2, NeurIPS 2025; five preprints), it ranked at or near the top on report quality and coverage, but completed fewer hard search tasks than the leader, and a larger share of its citation links did not resolve or did not exist. Most tests used 2025 versions (Gemini 2.5 Pro and 3 Pro); one tested the Gemini 3.1 Pro API agent. Several benchmarks used a Gemini model as the AI judge. Overall score 63. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 60
  disputes: 65
  adherence_to_limits: 55
  evidence_quality: 72
factor_notes:
  completion_rate: Top RACE report-quality score among deep research agents in DeepResearch Bench (48.88) and top quality in DeepResearchEval (8.51/10), but only 18% full success on Mind2Web 2 hard tasks (OpenAI Deep Research 28%), 13.3% hallucinated and 18.5% non-resolving citation URLs (highest of 10 systems, Rao et al.), and 12.9% strict acceptance on expert consulting tasks (Gemini 3.1 Pro). Judgment call.
  disputes: No legal or regulatory action specific to Deep Research found. Researchers disclosed indirect prompt-injection issues in the wider Gemini assistant (SafeBreach, Tenable), which Google reports it mitigated; none was shown to affect Deep Research specifically. Judgment call.
  adherence_to_limits: Mind2Web 2 authors had to modify prompts because Gemini Deep Research sometimes ignored the instruction to cite sources for all information; 72.94% of cited statements matched their sources (ReportBench). Usage limits and tool scope are documented by the vendor; no independent permission or limit test was found. Judgment call.
  evidence_quality: Seven independent performance sources, two peer-reviewed (ICLR 2026, NeurIPS 2025 D&B), one testing the current Gemini 3.1 Pro agent within the last 12 months. Three of the seven used a Gemini model as the main judge. Judgment call.
