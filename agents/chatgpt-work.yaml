name: ChatGPT Work (agent and cloud-browser tasks)
slug: chatgpt-work
category: Browser/web agent
type: commercial
homepage: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
scope: OpenAI's current agent for multi-step tasks and its cloud browser (launched July 2026). Successor to Operator (Jan–Jul 2025) and ChatGPT agent (Jul 2025–Aug 2026), both retired. Deep research reports are covered by the separate OpenAI Deep Research entry.
summary: ChatGPT Work is OpenAI's current agent for multi-step tasks, including a cloud browser that can act on websites. It replaced ChatGPT agent, which itself replaced Operator; both earlier products are retired. Independent tests exist for Operator and ChatGPT agent but are not counted. Two independent tests of ChatGPT Work were found (a hands-on review and an integration vendor's benchmark), fewer than the three required, so no overall score is given. Insufficient evidence. Informational only; not a guarantee, endorsement, or certification.
status: Insufficient evidence
scores:
  completion_rate: null
  disputes: null
  adherence_to_limits: null
  evidence_quality: null
factor_notes:
  completion_rate: 'Two independent tests of ChatGPT Work were found (fewer than the 3 required): AI Agents Library, 10 business tasks, mean 9.15/10, one task (publishing a webpage) not completed (Aug–Sep 2026); Composio Golden Eval, 45 of 47 business-app scenarios passed (July 2026). Earlier products, for reference only (not counted): Operator 61.3% (Online-Mind2Web), 68.6% (Emergence WebVoyager), 10% full success (Mind2Web 2); ChatGPT agent 65.8% (BearCubs).'
  disputes: No lawsuit, regulatory action or CVE specific to Operator, ChatGPT agent or ChatGPT Work was found. Researchers demonstrated prompt-injection data leaks (Operator) and a CAPTCHA-policy bypass (ChatGPT agent); both were reported to OpenAI.
  adherence_to_limits: The vendor documents site-access settings, confirmations before consequential actions and takeover for sign-ins; not independently tested for ChatGPT Work.
  evidence_quality: Two independent performance sources for the current product (one hands-on review, one integration-vendor benchmark), neither peer-reviewed. Five tests of the retired predecessors are listed but not counted.
