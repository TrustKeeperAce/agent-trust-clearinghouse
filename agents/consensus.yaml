name: Consensus
slug: consensus
category: research
type: commercial (free tier; paid Pro, Deep, Teams and Enterprise plans)
homepage: https://consensus.app/
scope: Consensus academic search and answer engine (Quick, Pro and Deep modes). The Deep Search agent (July 2025) and Research Agent (2026) were not separately tested.
summary: Consensus is a commercial AI search engine that answers research questions from scholarly papers. In six independent peer-reviewed tests (2024–2026, mostly health sciences), it found 9 of 23 eligible trials in a systematic-search test, gave no fully correct answer sets about retracted trials and included retracted studies without warning in 40% of topic overviews, agreed with expert evidence on 72% of bariatric-surgery statements, and received the highest expert quality ratings in an endodontics comparison. Overall score 62. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 50
  disputes: 80
  adherence_to_limits: 50
  evidence_quality: 75
factor_notes:
  completion_rate: Found 9 of 23 eligible RCTs with 76% false positives (Plast Aesthet Res); 0 of 15 fully correct answer sets on retracted trials (JMIR); 72% agreement with expert answers (Obesity Surgery); intermediate relevance in cardiology searches (EHJ Digital Health); highest expert quality scores in endodontics (BMC Oral Health). Judgment call.
  disputes: No lawsuit, regulatory action, data breach or security advisory found. Judgment call.
  adherence_to_limits: Repeated answers disagreed in 25.3% of cases, the most of 9 tools; retracted articles cited without warning in 6 of 15 overviews (JMIR). Privacy commitments (no training on user data, anonymized query logs) are vendor statements only. Judgment call.
  evidence_quality: Six independent peer-reviewed performance sources, two testing late 2025; small samples, mostly health sciences and mostly the free tier; Deep Search and Research Agent not separately tested. One abstract-only study listed, not counted. Judgment call.
overall_score: 62
overall_note: 0.30*50 + 0.20*80 + 0.25*50 + 0.25*75 = 62.25, rounded to 62 (Decision 0010)
evidence_grade: B
