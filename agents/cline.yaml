  note: 'Parasites in the Toolchain (Shanghai Jiao Tong, HKUST, Chaitin Technology; IEEE S&P 2026): attack success of malicious MCP tool chains across six clients (Cursor, VS Code, Cline, Cherry Studio, Claude Code, Codex) and several models; Cline was compromised in most trials with most models (often 3 to 5 of 5 per prompt; table read from extracted text). Disclosure: one author is at a security company; one author also wrote Red-Teaming Coding Agents (counted)'
