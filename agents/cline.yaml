name: Cline (open-source)
slug: cline
category: Coding agent
type: Open-source autonomous coding agent (Apache-2.0) from Cline Bot Inc.; VS Code and JetBrains extension, command-line tool (npm cline) and SDK; GitHub cline/cline
homepage: https://github.com/cline/cline
scope: 'The open-source Cline agent from the cline/cline repository, run with a language model chosen by the user: the VS Code extension (v3.x through v4.1.25, 16 October 2026), the JetBrains plugin and the Cline command-line tool (through 3.0.73, 17 October 2026), including its use in GitHub Actions workflows. Companion servers started by the command-line tool (Kanban, Hub dashboard) are covered under disputes. Forks such as Roo Code and Kilo Code are separate products; their results are not counted here, even when reported in the same studies.'
summary: Cline is an open-source coding agent that runs in VS Code, JetBrains IDEs or a terminal with a language model chosen by the user, and asks for approval before actions unless auto-approval is turned on. Twenty independent studies that ran it were found (eight peer-reviewed), most from 2026; thirteen are security studies. In task studies it was close to other harnesses with the same models in some settings (similar completion to OpenCode with GPT-5.3-Codex on ANCHOR; the highest success rate among assistants on GitChameleon 2.0 without a problem statement) and lower in others (31.2% against 37.8% for Claude Code on SWE-Nexus; 8.66% against 14.20% on SpreadsheetBench 2). Security studies found prompt injection, tool poisoning and malicious repositories leading to command execution in many configurations, often with auto-approval on; with approval required, one study found none of seven skill-file vulnerabilities still exploitable. Two high or critical CVEs in companion servers of the command-line tool have fixes in code, and independent researchers reported slow responses to several security reports in 2025 and early 2026. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 50
  disputes: 45
  adherence_to_limits: 40
  evidence_quality: 85
overall_score: 55
evidence_grade: A
grade_note: 'Grade A: 20 counted sources (8 peer-reviewed), and recent tests state the version tested: Red-Teaming Coding Agents (FSE 2026, Cline v3.82.0), Can Agents Trust Their Skills? (Cline CLI 3.0.47), What''s in Your Agent''s Context? (3.77.0) and Beware of Agentic Botnets (3.66.0). No counted test states a v4.x extension version. Results reflect the model and harness together (see Decision 0087, D3).'
independent_source_count:
  performance: 20
  peer_reviewed: 8
  other: 22
factor_notes:
  completion_rate: 'Same-model comparisons: on SWE-Nexus the highest resolved rate under Cline was 31.2% (GPT-5.5, GPT-5.4) against 37.8% under Claude Code and 29.7% under OpenCode (Claude Opus 4.8); on ANCHOR constrained completion with GPT-5.3-Codex was 37.7% in Cline and 37.4% in OpenCode; on SpreadsheetBench 2 (GLM-5) accuracy was 8.66% against 14.20% for Claude Code. On GitChameleon 2.0, Cline with GPT-4.1 had the highest success rate among assistants without a problem statement (38.4%). As a baseline it produced working workflow agents as often as the authors'' system (85.5%) with about 19 times the tokens (Beyond Generalist LLMs), and found all relevant files in 72.5% of large-project tasks against 82.5% for Cursor, OpenCode and Qoder (DeepDiscovery).'
  disputes: CVE-2026-44211 (CVSS 3.1 9.6, Kanban server started by Cline CLI 2.13.0 and earlier; the advisory lists no patched version, but an origin and host check is in the kanban package from 0.1.66, 27 April 2026) and CVE-2026-59723 (CVSS 3.1 8.8, Hub dashboard; NVD lists versions before CLI 3.0.30, 26 June 2026, as affected). On 17 February 2026 a leaked npm token was used to publish an unauthorized CLI release (2.3.0, replaced by 2.4.0 about 8 hours later); the token remained active after a prompt-injection flaw in the project's own issue-triage workflow, reported on 1 January 2026, was addressed only after public disclosure on 9 February. Independent researchers reported slow or no vendor responses to security reports in 2025 (Embrace The Red, Mindgard). No legal or regulatory action found.
  adherence_to_limits: 'Red-Teaming Coding Agents (FSE 2026): a tool-hijacking attack reached 1.0 success on Cline v3.82.0 with Gemini-3.1-pro and Grok-4.20, and the authors report that its default configuration lacks command allowlisting, although its system prompt restricts commands from external sources. MCP tool poisoning succeeded in most settings in IEEE S&P 2026 and ShareLock (above 90%); a hallucinated-repository attack ran code in 9 of 20 trials (Beware of Agentic Botnets). With Claude Sonnet 4.5, Cline 3.34.0 refused to read sensitive files for a poisoned tool but ran remote scripts when instructed (Journal of Cybersecurity and Privacy). In CLI 3.0.47, 7 skill-file vulnerabilities verified with auto-approval on and none remained exploitable with it off (Can Agents Trust Their Skills?). Other studies showed context and rule-file injection, a rollback leading to unauthorized mail forwarding, and a CI workflow posting private repository names. It followed 51% of project rules without an add-on (Zoro).'
  evidence_quality: Twenty independent sources, eight peer-reviewed (FSE 2026, DSN 2026, IEEE S&P 2026, Journal of Cybersecurity and Privacy, AAAI-26, ACL 2026, UIST '26, ECCWS 2026), most from 2026. Six state the Cline version tested, all within the last 12 months; none states a v4.x extension version. Thirteen are security studies and seven task studies, most comparing several harnesses with the same models; several propose competing or add-on methods (disclosed), and two pairs of counted studies share authors. About half of the matching works could not be downloaded, so the counted set is a sample of the studies found, not an exhaustive list.
uncertainties:
- Results reflect the model and the harness together; Cline is run with many different models.
- Thirteen of the 20 counted studies are security studies, so evidence on everyday task completion is thinner than the source count suggests.
- Most counted studies do not state the Cline version; the VS Code extension moved to v4.0.0 on 26 June 2026, and no counted study states a v4.x version.
- 'The CVE-2026-44211 advisory and NVD list no patched version; the fix date is inferred from cline/kanban pull request #421 and the kanban 0.1.66 package.'
- Several 2025 security reports (Embrace The Red, IDEsaster) have no confirmed fix status for Cline.
- Two pairs of counted studies share authors (SWE-Nexus and ANCHOR; Red-Teaming Coding Agents and Parasites in the Toolchain).
- Several figures were read from tables in extracted text or PDF layouts.
- Results for forks (Roo Code, Kilo Code) are not counted, even when reported in the same studies.
- 'Citation check incomplete — recheck later (OpenAlex full text used: 790 works matched and 295 downloaded; Semantic Scholar rate-limited).'
