  note: 'Red-Teaming Coding Agents from a Tool-Invocation Perspective (HKUST, Fudan; Proceedings of the ACM on Software Engineering, FSE 2026): six coding agents including Cline v3.20.8 (older models) and v3.82.0 (newer models); the authors'' two-channel tool-hijacking attack (RCE-2) reached 1.0 success on Cline with Grok-4, Sonnet-4 and Sonnet-4.5, and on v3.82.0 still reached 1.0 with Gemini-3.1-pro and Grok-4.20. The authors credit Cline''s system prompt with restricting commands from external sources, and report that ''Cline''s default configuration lacks these safeguards'' (command allowlisting or confirmation of high-risk tool calls). Table figures read from extracted text. Shares an author with Parasites in the Toolchain (counted)'
