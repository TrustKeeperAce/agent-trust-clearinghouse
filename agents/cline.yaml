  note: 'A First Look at the Security Issues in the Model Context Protocol Ecosystem (University of Delaware; DSN 2026): four MCP hosts (Cursor, Windsurf, Claude Desktop, Cline) with several models; none of the hosts, Cline included, verified that a tool the model selected came from the intended server, and context-dangling and tool-confusion success rates are reported for each host and model. By default, ''all hosts except Cline display concise summaries'' of tool calls, so Cline showed full details'
