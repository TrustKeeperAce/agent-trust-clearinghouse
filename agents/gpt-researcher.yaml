factor_notes:
  completion_rate: No published completion-rate figure. Independent studies show complete cited reports, with mixed head-to-head results. Judgment call.
  disputes: No user disputes found. Public databases list 7 security advisories; one is fixed per the maintainer. Judgment call.
  adherence_to_limits: Configurable limits are documented by the project. The self-hosted server ships without built-in authentication per its security policy. Judgment call.
  evidence_quality: Three independent performance evaluations (one main-conference paper, one companion-track paper, one preprint) plus public vulnerability databases. Judgment call.
