  kind: vendor or maintainer
  accessed: '2026-10-23'
  note: 'BC-Bench (Microsoft; preprint, August 2026): a benchmark in Microsoft''s Business Central language, run with Copilot CLI 0.0.382 to 0.0.409. Not counted (Decision 0031)'
- url: https://arxiv.org/abs/2607.01418
  kind: vendor or maintainer
  accessed: '2026-10-23'
  note: 'Adoption and Impact of Command-Line AI Coding Agents (Microsoft; preprint, July 2026): Microsoft''s internal rollout of Claude Code and Copilot CLI. Not counted (Decision 0031)'
