name: Devin (Cognition)
slug: devin
category: Coding agent
type: 'Proprietary cloud coding agent from Cognition AI: works in its own cloud virtual machine with shell, editor and browser, takes tasks from the web app, Slack, Jira or GitHub, and opens pull requests'
homepage: https://devin.ai
scope: The Devin cloud agent from its March 2024 announcement through Devin 2.x (Devin 2.0 released April 2025). No counted study states which Devin version it used. Windsurf (acquired by Cognition in July 2025), DeepWiki and other Cognition products are not covered.
summary: 'Devin is a proprietary cloud coding agent from Cognition AI that works in its own virtual machine and opens pull requests. Twelve independent sources that tested it were found (five peer-reviewed): eleven field studies of its public GitHub pull requests in 2024-2025 and an industry evaluation. Pull-request acceptance ranged from 30% to 68.0% and was usually among the lowest of the five agents compared, although it rose over time; an informal month-long review (not counted) reported 3 successes in 20 tasks. Its March 2024 launch demo was disputed, a 2024 access issue was fixed, and 2025 security research showed prompt-injection attacks that leaked data. No legal or regulatory action was found. Informational only; not a guarantee, endorsement, or certification.'
scores:
  completion_rate: 40
  disputes: 45
  adherence_to_limits: 40
  evidence_quality: 75
overall_score: 50
evidence_grade: B
grade_note: 'Grade B rather than A: 12 counted sources (5 peer-reviewed), but none states a version or is within the last 12 months, and eleven are field studies largely from one dataset (AIDev, December 2024 to July 2025), so they are not independent samples.'
independent_source_count:
  performance: 12
  peer_reviewed: 5
  other: 7
factor_notes:
  completion_rate: 'Pull-request acceptance: 30% for performance fixes, 42.9% for fix-related work, 43.0% estimated (lowest of five), 49%, 52.12% for security work, 53.76%, 55.5% and 68.0% in the common May-July 2025 window (MSR 2026), usually below Codex, Cursor and Claude Code and close to Copilot. Acceptance rose about 0.77 points per week. An informal Answer.AI review (not counted) reported 3 of 20 tasks succeeding (January 2025). Anthar Study: highest correctness on Python tasks.'
  disputes: The March 2024 launch demo of an Upwork job was disputed by a software engineer and by the client; Cognition said Devin "is often inefficient and makes mistakes". CVE-2024-56083 (session live-share URL gave write access) was fixed on 2024-12-12. Prompt-injection findings were reported to Cognition in April 2025; the researcher says follow-up questions went unanswered. No legal or regulatory action was found. SWE-bench 13.86% is a self-report (not counted).
  adherence_to_limits: Security research (2025) showed that injected instructions could make Devin run downloaded code, leak secrets and expose ports; Devin had unrestricted internet access by default at the time. Merged Devin pull requests were reverted more often than human ones (14.5% vs 11.5%). Devin changed CI/CD files most often (4.83%). Rejections often came from Devin closing its own inactive pull requests (32.1%).
  evidence_quality: Twelve independent sources, five peer-reviewed (four MSR 2026 papers and one Information and Software Technology article). Eleven are field studies largely from one dataset (AIDev, December 2024 to July 2025), so they are not independent samples; the twelfth is an industry report with a disclosure; none states a version and none is within 12 months. Grade B.
uncertainties:
- Most counted sources share the AIDev pull-request data from 2024-2025; Devin 2.x and later models may behave differently.
- No counted study states the Devin version.
- Acceptance rates depend on repository, task type and reviewer behaviour.
- The 2025 security findings were not confirmed as fixed in the sources found.
- Citation check incomplete — recheck later (Semantic Scholar was rate-limited; OpenAlex was used).
