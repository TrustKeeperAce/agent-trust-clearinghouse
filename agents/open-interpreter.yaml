name: Open Interpreter
slug: open-interpreter
category: simple analysis
type: open-source (Apache-2.0)
homepage: https://github.com/openinterpreter/openinterpreter
scope: Local code-executing agent for data analysis and automation
summary: Open Interpreter is an open-source agent that runs code on the user's computer from natural-language instructions. Its repository now tracks a rewrite built on Codex; the earlier Python version continues in a community fork. Independent security studies, mostly preprints and self-published projects, tested the earlier Python version; we found no independent evaluation of the current product, so no overall score is given. Insufficient evidence. Informational only; not a guarantee, endorsement, or certification.
status: Insufficient evidence
scores:
  completion_rate: null
  disputes: null
  adherence_to_limits: null
  evidence_quality: null
factor_notes:
  completion_rate: No independent evaluation of Open Interpreter's own task success was found; one benchmark used it only as a fixed harness to compare models.
  disputes: No lawsuits or regulatory actions were found. No CVE (NVD) or reviewed GitHub Advisory Database entry was found. Public reports allege security issues in the earlier Python version; the maintainer closed them as concerning the legacy product.
  adherence_to_limits: Studies report high attack-success rates for the earlier Python version in risky-code and prompt-injection tests. Documentation for that version describes confirmation before running code unless auto-run is enabled, and an experimental safe mode that is off by default. The current product's sandbox and approval modes have not been independently evaluated.
  evidence_quality: No independent evaluation of the current product; studies of the earlier Python version are preprints or self-published, none peer-reviewed.
overall_score: null
evidence_grade: Insufficient evidence
independent_source_count:
  performance: 0
  other: 7
  count_note: 0 for the current product; 3 behaviour studies of the earlier Python version are outside the entry scope and not counted.
