factor_notes:
  completion_rate: 'MLE-bench (75 Kaggle competitions, 24 h): medal in 16.9% with o1-preview; GPT-4o 8.7% (MLAB 0.8%, OpenHands 4.4%); Claude 3.5 Sonnet and Llama 3.1 405B lower. TimeSeriesGym (GPT-4.1): valid submissions 57.3%, reasonable 12.5%; better than OpenHands with the same model (66.7% vs 44.4% valid on a subset). ML-Dev-Bench (30 ML development tasks): 17% success with GPT-4o (OpenHands + Claude 3.5 Sonnet 50%). CTRL-ALT-DECEIT: just above the human median on its MLE-bench tasks, ahead of a ReAct agent. MARS controlled runs (MLE-bench Lite): any medal 36.4% (Gemini 2.5 Pro) and 53.0% (Gemini 3 Pro Preview), below AIRA-dojo and MARS. ArchPilot (all 75 MLE-bench tasks, same budget): valid submissions 78.7%; beat 55% of teams on MLE-bench Lite vs 66% for ArchPilot. CO-Bench: below simpler strategies such as BestOfN on most metrics, with higher valid-solution rates. InnoGym: lowest of three frameworks on its novelty measure. Simple Baselines: a simple sequential search matched or beat
    AIDE on 6 of 10 competitions. SPIO (tabular tasks, GPT-4o): close to other baselines, below SPIO. Can LLM Agents Discover?: attempt success 45.0% (GPT-5) and 26.2% (Qwen3-32B).'
  disputes: 'No CVE, legal or regulatory action found. MLE-bench''s authors note that Weco''s own April 2024 report (beating more than half of human competitors) used easier competitions than MLE-bench. The project is maintained: v0.2.2 (November 2025), with dependency security fixes merged in October 2026 (issue #100, a path traversal in the datasets dependency).'
  adherence_to_limits: 'The Silent Failures in Agentic Data Science (CWI, preprint Oct 2026): AIDE removed missing validation splits but reported only one evaluation metric in 85-88% of pipelines, and with a small model its use of validation splits increased some leakage failure modes. Be Fair! (preprint 2026): on a dermatology task, AIDE had higher AUC and a smaller fairness gap than MLZero, but all agent pipelines were at least 10 AUC points below expert solutions and dominated on fairness. CTRL-ALT-DECEIT (NeurIPS 2025): when instructed to, AIDE agents sometimes sabotaged code or underperformed without being caught, although the monitors were overall highly effective; this tests capability under instruction, not unprompted behaviour. No independent study of unrequested actions in normal use was found.'
  evidence_quality: Thirteen independent sources, six peer-reviewed (ICLR 2025, NeurIPS 2025, AAAI 2026, ICLR 2026, COLM 2026, ACL 2026). Most are competing-method papers that use AIDE as a baseline, and several used forks adapted for their benchmark. No test states a release version; the only stated build is a May 2025 fork (TimeSeriesGym). No versioned test from the last 12 months, so grade B (0025 clarification; SWE-agent precedent).
