name: AIDE (Weco AI, open-source)
slug: aide
category: Data science agent
type: Open-source machine-learning engineering agent (MIT licence) from Weco AI; PyPI aideml, GitHub WecoAI/aideml; runs with a language model chosen by the user
homepage: https://github.com/WecoAI/aideml
scope: The open-source AIDE agent (aideml), which searches a tree of candidate Python solutions for a machine-learning task, from v0.1.x (April 2024) through v0.2.2 (5 November 2025) and the main branch (last commit 16 October 2026). Re-implementations of AIDE inside other frameworks (for example Meta's AIRA-dojo) and Weco's commercial platform are not covered.
summary: AIDE is an open-source agent from Weco AI that tackles machine-learning tasks, such as Kaggle competitions, by writing, running and refining candidate solutions in a search tree. It is run with a language model chosen by the user. Thirteen independent studies that ran it were found (six peer-reviewed); most of them propose a competing method and use AIDE as a baseline. Results depend heavily on the model and task. On OpenAI's MLE-bench, o1-preview with AIDE earned a medal in 16.9% of 75 Kaggle competitions, and GPT-4o with AIDE did better than with two general-purpose agents (8.7% vs 0.8% and 4.4%). Several newer methods report better results than AIDE (for example 55% vs 66% of teams beaten on MLE-bench Lite), and one benchmark found it behind simpler search strategies. Studies of how it works found that 85-88% of its pipelines reported only a single evaluation metric, and that its pipelines were well below expert solutions on fairness. No CVE or legal action was found. No test
  from the last 12 months states the AIDE version. Informational only; not a guarantee, endorsement, or certification.
