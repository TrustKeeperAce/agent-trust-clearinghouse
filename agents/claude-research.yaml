name: Claude Research
slug: claude-research
category: Research
type: 'commercial (paid Claude plans: Pro, Max, Team, Enterprise)'
homepage: https://support.claude.com/en/articles/11088861-use-research-on-claude
scope: The Research mode in Claude's web, desktop and mobile apps (launched April 2025). Plain Claude models used via the API are not covered.
summary: Claude Research is Anthropic's research mode in the Claude apps. It runs multiple connected web searches, and can also search connected tools, to produce cited reports. In independent 2025 tests, its report quality was mid-tier to strong (15th of 31 systems on DeepResearch Bench; 2nd of 9 for quality on DeepResearchEval), but it achieved 10% full success on hard Mind2Web 2 tasks, 60.7% of its statements were judged factually correct in DeepResearchEval, and in one dermatology test most references had fabricated authors or titles. Research now runs on Claude Opus 5.5 (September 2026), which has not been independently tested. Overall score 58. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 50
  disputes: 75
  adherence_to_limits: 50
  evidence_quality: 60
factor_notes:
  completion_rate: DeepResearch Bench RACE 45.00, 15th of 31 (OpenAI DR 46.45, Gemini DR 49.71); DeepResearchEval quality 7.53/10, 2nd of 9; Mind2Web 2 partial completion 0.32, success 0.10; fake authors or titles in 95.8% of references in a dermatology review test (Keplinger et al.). Judgment call.
  disputes: No lawsuit, regulatory action or security incident specific to Research was found. Claude-wide prompt-injection exfiltration findings (Files API) are noted as context. Judgment call.
  adherence_to_limits: Factual ratio 60.72%, 8th of 9 (DeepResearchEval); fabricated references (Keplinger et al.). Per Anthropic, Research uses connector tools without asking for approval each time and silently skips connectors on mobile. Judgment call.
  evidence_quality: Four independent performance sources, three peer-reviewed, all testing 2025 versions. None tested Research on Claude Opus 5.5. Mind2Web 2 has Amazon AGI co-authors (Amazon invests in Anthropic). DeepResearch Bench could not score citations for Claude Research. Judgment call.
