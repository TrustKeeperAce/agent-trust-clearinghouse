name: OpenAI Deep Research
slug: openai-deep-research
category: research
type: commercial
homepage: https://openai.com/index/introducing-deep-research/
summary: OpenAI Deep Research is a commercial ChatGPT feature that writes cited research reports. In independent evaluations (DeepResearch Bench, ICLR 2026; Mind2Web 2, NeurIPS 2025; ReportBench; a citation-URL study; TTD-DR preprint), it ranked among the stronger systems tested on report quality and task success, while a share of its citations did not match their sources or did not resolve. Most tests used 2025 versions; the underlying model has changed since. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 60
  disputes: 65
  adherence_to_limits: 60
  evidence_quality: 75
factor_notes:
  completion_rate: In Mind2Web 2 it fully completed 28% of hard tasks (highest among systems listed) and partially completed 54%. Judgment call.
  disputes: No formal disputes specific to this feature were found. Independent tests found about 78% citation accuracy and 3.5% fabricated / 10.1% non-resolving citation URLs. Judgment call.
  adherence_to_limits: Usage caps, site restriction and read-only connected apps are documented by the vendor; no independent adherence test was found. Judgment call.
  evidence_quality: Five independent performance sources, two peer-reviewed (ICLR 2026, NeurIPS 2025 D&B); most tested 2025 versions. Judgment call.
overall_score: 65
evidence_grade: B
