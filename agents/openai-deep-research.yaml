version_note: OpenAI updated deep research in February 2026 and removed the legacy mode on 26 March 2026; the counted tests used 2025 versions; the current version has not been independently tested. (as of 2026-10-17; Decision 0019)
security_note: 'ShadowLeak (Radware, September 2025): zero-click indirect prompt injection via a crafted email could make deep research exfiltrate Gmail data when the Gmail connector was enabled; reported to OpenAI in June 2025 and fixed in August 2025.'
uncertainties:
- The underlying model has changed over time; most independent tests used 2025 versions.
- No independent test of usage-limit or permission adherence was found.
- ReportBench venue status is unverified; two sources are preprints.
- Benchmarks rely partly on AI judges.
- Vendor benchmark figures (e.g. HLE, GAIA) are not used as independent evidence.
