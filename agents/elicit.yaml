name: Elicit
slug: elicit
category: research
type: commercial (free Basic tier; paid Plus, Pro and enterprise tiers)
homepage: https://elicit.com/
summary: Elicit is a commercial AI research assistant that searches academic papers and supports systematic-review steps (screening and data extraction). Its literature search is weak. In independent tests, mostly in health research, Elicit searches found about 18–40% of the studies identified by traditional systematic searches. Its data extraction agreed with human reviewers about 77–92% of the time on the variables tested, with some errors and made-up details, and screening caught 71–78% of relevant studies in a 2026 preprint. Researchers concluded that Elicit can assist but not replace human reviewers. Most tests used paid tiers between 2023 and 2026. Overall score 68. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 55
  disputes: 80
  adherence_to_limits: 55
  evidence_quality: 85
factor_notes:
  completion_rate: 'Search: average sensitivity 39.5% vs 94.5% for traditional searches (Lau et al.), 17.6% of included studies found (Bernard et al.), 1 of 59 results relevant (Vyas et al.), 158 of 5,285 studies (Wei et al.). Screening: sensitivity 0.71 (abstract) and 0.78 (full text), precision 0.38 (Wei et al.). Extraction: 92% precision/recall (Andersen et al.), 77–90% value matches (Lagisz et al.), 79% fully accurate (Wei et al.), mostly partial matches for complex variables (Bianchi et al.). Judgment call.'
  disputes: No legal or regulatory actions, security advisories or data incidents were found. Fabricated details found in tests (4 confabulations in Andersen et al.; a wrongly cited protocol in Bernard et al.) are scored under completion. Judgment call.
  adherence_to_limits: Results varied between repeated runs (169–246 search results across three identical searches; extracted values matched 90% across accounts, but supporting quotes only 46%). It sometimes gave multiple answers where one was required and defaulted study location to the authors' country. Privacy and no-training commitments for uploaded files are vendor statements only. Judgment call.
  evidence_quality: Seven independent performance sources, six peer-reviewed, one testing the current paid tier in 2025–2026. Samples are small and mostly from health sciences; one had free accounts from Elicit (partly independent). Two further studies were read from abstracts only and are not counted. Judgment call.
overall_score: 68
overall_note: 0.30*55 + 0.20*80 + 0.25*55 + 0.25*85 = 67.5; exact .5 rounds up (Decision 0010)
evidence_grade: A
