  note: 'What Does a Harness Buy? Tokens, Mostly. (Liu and Han; Shandong University; preprint, October 2026): several harnesses with the same open model (Qwen3.8-27B) across repeated runs. Most harness differences were within run-to-run noise; the one clear effect was that OpenCode trailed by up to 9 points on the 447-task pool, about half of it traced to its output-length cap. Pinned OpenCode 1.18.25 to 1.18.31'
