  note: 'On Coding Agent Issue Localization Accuracy – An Exploratory Study (Coppola, Esposito, Kazman, Lenarduzzi; University of Southern Denmark, University of Oulu, University of Hawaii; ESEM 2026, LIPIcs): 2,441 issue-fixing commits from 10 Java projects, each given to three agents built from the OpenCode harness and an open-weight model (GLM-5, Qwen3.5, Kimi-K2.5). Agents located the right package more often than the right class or method, recall stayed well below precision, and agreement with the developers'' fixes (MCC) was negative at every level; GLM-5 scored highest. Fixed-harness study of models; version not stated'
