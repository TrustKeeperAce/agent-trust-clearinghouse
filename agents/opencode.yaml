  kind: independent performance
  peer_reviewed: false
  version_tested: OpenCode 1.18.31
  test_date: 2026-09
  accessed: '2026-10-21'
  note: 'Timeline-Bench (Gupta, Arora and Tankala; TensorTest, Ritivel Labs; preprint, September 2026): 56 video-editing tasks from raw footage to final cut, 16 agents. GPT-6 Astra in OpenCode 1.18.31 resolved 21.4% of tasks, the same as in Codex CLI; with one run per task each rate has a 95% interval of about 11 points. The authors'' company runs the benchmark; no product of theirs is compared'
