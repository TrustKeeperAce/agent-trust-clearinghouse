  note: 'Package Hallucination Attacks on coding agents (Duke University; preprint, October 2026): poisoned rule files that make agents install attacker-named packages, run in autonomous mode with confirmations off. With Qwen3-Coder-30B, attacks succeeded on OpenCode 15.85% to 84.78% of the time across five packages, against 81.82% to 98.72% for OpenHands; with DeepSeek-V4-Flash, 75.32% to 93.94%. The authors note OpenCode''s noticeably lower attack success with similar task ability. Version not stated'
