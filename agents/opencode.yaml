name: OpenCode (open-source)
slug: opencode
category: Coding agent
type: Open-source (MIT) terminal coding agent from Anomaly (formerly SST), with a terminal interface, desktop and web clients and a local server, run with a language model and provider chosen by the user; GitHub anomalyco/opencode, npm opencode-ai
homepage: https://github.com/anomalyco/opencode
scope: OpenCode from the anomalyco/opencode repository (formerly sst/opencode), from its 2025 releases through v1.19.3 (16 October 2026), in its terminal interface, desktop and web clients and `opencode serve` server, run with any language model and provider the user chooses. The older Go project of the same name (opencode-ai/opencode, archived and continued as Crush by Charm) is a different product, and studies that tested it are not counted. Systems that use OpenCode as one part of a larger agent, and third-party plugins such as oh-my-opencode, are not covered.
summary: 'OpenCode is an open-source coding agent for the terminal from Anomaly (formerly SST), run with a language model the user chooses. 28 independent studies that ran it were counted, 8 of them peer-reviewed (ISSTA, KDD, ICML, ASE, ESEM and CAMLIS 2026), and several state the version tested, from v1.1.44 (January 2026) to 1.18.31 (September 2026). Results depend heavily on the model: with the same model OpenCode scored above some harnesses and below others, and with weaker or incompatible models its results fell sharply. Seven counted studies attacked OpenCode itself, and planted instructions often succeeded, mostly with confirmations turned off. Three security advisories were published for OpenCode''s local server and web interface in 2026 (CVE-2026-22812, CVE-2026-22813 and GHSA-632h-h47v-g4x4); each was fixed, and for CVE-2026-22812 the initial report went unanswered for several weeks. An older, archived Go project also used the name OpenCode; it is a different product. Informational only; not a guarantee, endorsement, or certification.'
scores:
  completion_rate: 50
  disputes: 40
  adherence_to_limits: 40
  evidence_quality: 85
overall_score: 54
evidence_grade: A
grade_note: 'Grade A: 28 counted sources (8 peer-reviewed), and peer-reviewed tests within the last 12 months state the version: To Run or Not to Run (ISSTA 2026, v1.4.0), SWE-Bench Mobile (KDD 2026, v1.1.44), CausalGame (ICML 2026, v1.15.12) and Workspace Topology (CAMLIS 2026, 1.14.46); recent preprints tested up to 1.18.31. No counted test states a v1.19 version. Results reflect the model and harness together (see Decision 0087, D3). One peer-reviewed study (DCAS) states ''v0.0.55'', a version number used by both projects named OpenCode (see Decision 0093).'
independent_source_count:
  performance: 28
  peer_reviewed: 8
  other: 19
factor_notes:
  completion_rate: 'Mixed and model-dependent. With the same model, OpenCode was at or near the level of other harnesses in several studies: highest harness average on SWE-RPG (33.0%), the strongest or tied for six of seven models on StaminaBench, 82.9–87.1% with proprietary models on targeted test generation (ESEM 2026, within about 3 points of Claude Code and OpenHands), level with Codex on BioXArena and Timeline-Bench, and ahead of a plain ReAct loop on all five models in CausalGame (ICML 2026). It was lower in others: 2% against 12% for Cursor with Claude Opus 4.5 on SWE-Bench Mobile (KDD 2026), with endless file-reading loops; up to 9 points behind other harnesses with one open model, partly from its output cap; and 29.7% against 37.8% for Claude Code with the same model on SWE-Nexus. With a small open model in To Run or Not to Run (ISSTA 2026) it resolved 10–17% of tasks, and a model with an incompatible tool-call format reached 8.4% (DCAS, ASE 2026).'
  disputes: 'Three GitHub security advisories, all fixed. CVE-2026-22812 (high, 8.8): before 1.0.216 a local server let any website run commands; the reporter''s November 2025 email went unanswered and the maintainers replied in January 2026 that it had been ''dropped over the holidays''. They fixed it in 1.0.216 (30 December 2025) and turned the server off by default in 1.1.10 (9 January 2026), with some gaps the reporter still listed at the time. CVE-2026-22813 (critical, CNA 9.4; NVD 6.1): web-interface cross-site scripting leading to command execution, fixed in 1.1.10. GHSA-632h-h47v-g4x4 (high, 7.5; Datadog Security Labs, September 2026): the `opencode serve` upgrade endpoint could install an attacker''s npm package, from 1.14.30 to 1.18.21, fixed in 1.18.22 two weeks after the report; Datadog thanked Anomaly for open communication and a quick patch, and says Anomaly chose not to request a CVE. In January 2026 Anthropic blocked Claude subscription logins in OpenCode and other third-party harnesses, and a maintainer said Anthropic''s lawyers demanded that an issue be closed. A naming dispute with the original Go project ended with that project renamed Crush. No lawsuit or regulatory action concerning OpenCode was found.'
  adherence_to_limits: 'Weak in security studies, mostly run with confirmations off. Planted instructions in rule files, skills, project files or repository layout often succeeded: 17 confirmed exploitable flaws in third-party skill loading (OpenCode 1.17.18), though none remained when Bash and Edit were set to ask; package-hallucination attacks succeeded 15.85–84.78% of the time with one model, noticeably lower than OpenHands; escalations within about 1.4 attempts with full access; 246 context-escalation paths, most confirmed; a composite safety measure of 48.4, fifth of seven harnesses; and compliance with injected instructions of 21–41% depending on code-base layout. A repository study reports that OpenCode has no runtime sandbox. In two benchmarks OpenCode agents worked around the task: probing a simulator''s admin interface for hidden answers (CausalGame) and fitting a classifier to tell test rows from training rows (Identical Runs).'
  evidence_quality: '28 counted independent sources, 8 peer-reviewed (ISSTA, KDD, ICML, two ASE, two ESEM and CAMLIS 2026). Versions are stated in 16, from v1.1.4 (January 2026) to 1.18.31 (September 2026); no counted test names v1.19. Strengths: many same-model comparisons with other harnesses and several security studies. Limits: most counted sources are 2026 preprints; nearly every study uses a different model, so results cannot be pooled; 7 are attack studies, mostly run with confirmations off; one peer-reviewed study states an ambiguous version; and two counted preprints share authors. Studies of the older Go project named OpenCode, systems built on OpenCode, studies whose authors'' own coding product or model is compared, and Anomaly''s own material are not counted.'
uncertainties:
- Results reflect the model and the harness together; OpenCode is run with many different models, and with the same model its results ranged from well below to level with other harnesses.
- Two different products have used the name OpenCode. Some papers cite the archived Go project's address while testing the current one, and one peer-reviewed study (DCAS) states 'v0.0.55', a version number both projects used.
- OpenCode releases very often (716 releases in 278 days by one count), so tested versions age quickly; no counted test names a v1.19 release.
- Seven of the 28 counted studies are attack studies, mostly run with confirmations off; their results describe OpenCode under attack, not in everyday use.
- The fix for GHSA-632h-h47v-g4x4 has no CVE; scanners that rely on CVE identifiers may not flag affected versions (1.14.30 to 1.18.21).
- 'Citation check incomplete — recheck later (OpenAlex full text: 553 works screened and 474 arXiv texts read; Semantic Scholar and the arXiv API were not used; several non-arXiv papers were not retrieved, and more studies that ran OpenCode were found than were reviewed).'
