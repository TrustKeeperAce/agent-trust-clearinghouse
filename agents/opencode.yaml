  test_date: '2026'
  accessed: '2026-10-21'
  note: 'Beyond Heuristics? Targeted Unit Test Generation with LLM Agents (Institute of Software, Chinese Academy of Sciences; ESEM 2026, LIPIcs): nine combinations of three harnesses and three models on targeted unit-test generation. OpenCode succeeded on 82.9% of tasks with Claude 4.5 Sonnet, 87.1% with GPT-5 and 65.2% with DeepSeek-V3.2, against 83.8%, 89.5% and 67.1% for Claude Code and 81.4%, 87.6% and 63.8% for OpenHands; OpenCode''s average cost per task was the lowest of the three for each model. Version not stated'
