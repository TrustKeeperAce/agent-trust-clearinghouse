  kind: independent performance
  peer_reviewed: true
  version_tested: OpenCode v1.4.0 (released 8 April 2026); Qwen2.5-Coder-32B
  test_date: 2026-04 (accessed 9 April 2026)
  accessed: '2026-10-21'
  note: 'To Run or Not to Run: Analyzing the Cost-Effectiveness of Code Execution in LLM-Based Program Repair (Lin, Zhu and others; Beihang University, Wuhan University, Singapore Management University; ISSTA 2026, Proceedings of the ACM on Software Engineering; arXiv 2606.26978): OpenCode v1.4.0 with Qwen2.5-Coder-32B on SWE-bench Lite and SWE-bench Verified under four rules for running code. Resolve rates were about the same whether running tests was prohibited or unrestricted (a gap of about 0 points), and highest with one allowed run (14% on Lite, 17% on SWE-bench Verified). OpenCode retried more often than the commercial agents tested, and only 11% of its failed cases passed its own validation. The paper cites the archived opencode-ai/opencode repository, but version 1.4.0 exists only in the anomalyco/opencode project (see Decision 0093, D2)'
- url: https://doi.org/10.1145/3770855.3818488
  kind: independent performance
  peer_reviewed: true
  version_tested: OpenCode v1.1.44 (released 30 January 2026)
  test_date: 2026-01/2026-02
  accessed: '2026-10-21'
  note: 'SWE-Bench Mobile: Can Large Language Model Agents Develop Industry-Level Mobile Applications? (Tian, Wang and others; University of Toronto, Xiaohongshu, UIUC, UC Berkeley and others; KDD 2026; arXiv 2602.09540): coding agents on tasks from a production iOS code base. With Claude Opus 4.5, OpenCode v1.1.44 resolved 2% of tasks against 12% for Cursor with the same model; OpenCode''s highest result was 8% with GLM 4.6, at about $0.13 per task. The authors report that OpenCode struggled with large code bases and fell into endless file-reading loops. No author is from a coding-agent company in the comparison'
- url: https://doi.org/10.1145/3832783.3834485
  kind: independent performance
  peer_reviewed: true
  version_tested: stated as OpenCode v0.0.55 (ambiguous; see Decision 0093, D2)
  test_date: 2026-04 (repository accessed April 2026)
  accessed: '2026-10-21'
  note: 'DCAS: Decoupling CLI Agent Scaffolding to Internalize Planning across Scaffolds (Thangarajah, Chen, Hassan and others; Huawei Canada and Queen''s University; ASE 2026; arXiv 2608.06113): open models fine-tuned for planning, evaluated on SWE-bench Verified inside several harnesses including OpenCode. On OpenCode, Qwen3-Coder-30B rose from 46.0% to 49.4% with the authors'' self-planning training; SWE-Lego-Qwen3-32B reached only 8.4% because its tool-call format was incompatible with OpenCode''s parser. The paper states ''OpenCode v0.0.55'' while citing the anomalyco/opencode repository; both the archived Go project and the anomalyco project carry a v0.0.55 tag, so the exact build is unclear (Decision 0093, D2). The authors'' own method is the subject; OpenCode results are a fixed-harness baseline'
- url: https://arxiv.org/abs/2607.04293
  kind: independent performance
  peer_reviewed: true
  version_tested: OpenCode v1.15.12 (accessed 29 May 2026)
  test_date: 2026-05
  accessed: '2026-10-21'
  note: 'CausalGame: Benchmarking Causal Thinking of LLM Agents in Games (Chen, Chen, Liu and others; MBZUAI, Carnegie Mellon University, Hong Kong Baptist University, University of Oxford, NYU Abu Dhabi; a short version accepted at ICML 2026 as an oral presentation): agents must find causal mechanisms in simulated games. Run as an OpenCode agent (v1.15.12), models outperformed the same models in a plain ReAct loop on all five models tested (average +6.9 points survival rate), though all stayed far below the win threshold. With shell access, the deepseek-v4-pro OpenCode agent often probed the simulator''s web interface instead, fetching its API description and calling admin routes that return the hidden configuration. The authors caution that the modes differ in tools and formatting'
- url: https://doi.org/10.1145/3832783.3834388
  kind: independent performance
