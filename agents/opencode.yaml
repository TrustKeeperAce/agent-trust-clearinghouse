  note: 'A Jagged Frontier (Central South University, Microsoft, UIUC, CMU; preprint, August 2026): harnesses run on perturbed versions of SWE-bench Verified and SWE-bench Pro tasks. OpenCode v1.18.4 lost 1.88 points on SWE-bench Verified and 3.65 on SWE-bench Pro under perturbation and resolved 81.20% of unperturbed SWE-bench Verified runs; Qwen was the most brittle model under OpenCode (5.5 points) but the most robust under mini-SWE-agent (0.2 points). One co-author is from Microsoft, which makes GitHub Copilot; Copilot is not in the comparison'
