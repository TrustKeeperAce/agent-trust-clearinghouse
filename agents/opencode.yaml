  kind: independent performance
  peer_reviewed: false
  version_tested: unstated
  test_date: 2026-10
  accessed: '2026-10-21'
  note: 'SWE-Nexus (National University of Singapore, Shanghai AI Laboratory, Tsinghua University and independent researchers; preprint, October 2026): composite software tasks from test execution, 12 models under three harnesses. The highest OpenCode result was 29.7% (Claude Opus 4.8), against 37.8% for the same model in Claude Code. Shares authors with ANCHOR'
