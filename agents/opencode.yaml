  note: 'Beyond the Model: Demystifying Harness Effects in Software Engineering Agents (Hu, Zhang and others; Nanjing University of Science and Technology, Technical University of Munich, Nanjing University; preprint, September 2026): harness comparisons with fixed models; with stronger Qwen models the gap between OpenCode and mini-SWE-agent narrowed to 2.67 points, and with DeepSeek-V4-Pro the scores were 34.3 for OpenCode and 33.7 for mini-SWE-agent. Version not stated'
