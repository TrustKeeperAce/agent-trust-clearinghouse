  test_date: 2026-09
  accessed: '2026-10-21'
  note: 'MobileCybench: Evaluating Agent Vulnerability Discovery via Executable Probes (Zhang and others; Stanford University and UC Berkeley; preprint, September 2026): five coding agents look for vulnerabilities in Android apps. Given only an obfuscated app, OpenCode with GPT-5.6-Sol triggered a probe in 53.8% of apps in the malicious-app setting and 16.7% in the remote-attacker setting, the highest of the five configurations (OpenCode with three models; Claude Code with two). Version not stated'
