  kind: independent performance
  peer_reviewed: false
  version_tested: unstated
  test_date: 2026-09
  accessed: '2026-10-21'
  note: 'Hearsay: Can an Auditor Trust the Record a Deployed Agent Harness Writes? (Nanyang Technological University, National University of Singapore, Case Western Reserve University; preprint, September 2026): checks whether 16 harnesses'' own run logs match what actually happened. OpenCode''s record matched for 77.0% of checked claims, and all 390 of its tool calls could be reconciled'
