  test_date: 2026-01
  accessed: '2026-10-21'
  note: 'RepoMod-Bench (Modelcode AI; preprint, February 2026): code-repository modernization tested with implementation-agnostic tests. Across 21 benchmarks OpenCode v1.1.4 passed 43.0% with GPT-5.2 and 42.0% with Claude Opus 4.5, against 48.2% for Claude Code and 30.4% for Codex CLI; on single repositories OpenCode''s result ranged from 0.5% to 99.5% depending on the model. The authors'' company works on code modernization; its own product is not in the comparison'
