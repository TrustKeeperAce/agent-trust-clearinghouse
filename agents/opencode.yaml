  test_date: '2026'
  accessed: '2026-10-21'
  note: 'PERFOPT-Bench (OPPO Research Institute, University of Arizona, City University of Hong Kong and others; preprint, July 2026): 12 performance-optimization tasks for seven harness and model stacks. OpenCode with GPT-5.5 won 4 tasks with a geometric-mean speedup of 9.2x (Codex with GPT-5.5: 4 tasks, 8.2x); OpenCode with Opus 4.7 won 2.5 against 1.5 for Claude Code with the same model. Audited outliers showed some agents fitting the code to the benchmark''s validation instead of optimizing it. OpenCode v1.14.31'
