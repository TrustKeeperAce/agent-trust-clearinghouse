  note: 'StaminaBench: Stress-Testing Coding Agents over 100 Interaction Turns (Sobal and others; AWS Agentic AI; preprint, June 2026): how many consecutive change requests agents handle before failing, for several open models in OpenCode, mini-SWE-agent and OpenHands. OpenCode was the strongest or statistically tied for six of seven models, and Qwen Code did significantly worse than OpenCode with the Qwen models. The authors work at AWS; no AWS coding agent is in the comparison'
