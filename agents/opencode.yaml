  test_date: '2026'
  accessed: '2026-10-21'
  note: 'Workspace Topology as an Attack Vector (Capital One; preprint of a paper accepted at CAMLIS 2026): prompt-injection payloads placed in different parts of a code base given to opencode 1.14.46 with gpt-oss-120b. How the code base is laid out changed how often the agent carried out the injected instruction: compliance fell from 41% in the least modular code bases to 21% in the most modular, and attack success intervals for low and high modularity did not overlap. Security study'
