  note: 'From Runnable Code to Shippable Applications: Test-Driven Development for Full-Stack Web Applications (CUHK, Columbia University, Singapore Management University; ASE 2026; arXiv 2605.17242): OpenCode is the base agent for the authors'' test-driven method. Unmodified OpenCode passed 72.0% of the benchmark''s checks, against 89.2% with the authors'' incremental test-driven workflow. Version not stated; the authors'' own method is the subject'
- url: https://doi.org/10.4230/LIPIcs.ESEM.2026.59
  kind: independent performance
