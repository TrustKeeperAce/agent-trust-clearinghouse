name: OpenAI Codex (CLI and cloud agent)
slug: openai-codex
category: Coding agent
type: 'Coding agent from OpenAI: open-source Codex CLI (Apache-2.0; GitHub openai/codex), IDE extension and desktop app, and the cloud Codex agent in ChatGPT; runs OpenAI models by default and other models via configuration'
homepage: https://github.com/openai/codex
scope: 'The Codex agent products launched from April 2025: Codex CLI (including headless exec), the IDE extension and desktop app, and the cloud Codex agent that opens pull requests, through Codex CLI rust-v0.163.0 (15 October 2026). The 2021 Codex model behind early GitHub Copilot, and GPT-Codex models run inside other harnesses, are not covered.'
summary: OpenAI Codex is OpenAI's coding agent, available as an open-source command-line tool, an IDE extension and desktop app, and a cloud agent that opens pull requests. Twenty-six independent studies that ran it were found (five peer-reviewed). Results depend heavily on the model and task. Codex CLI had the highest score in several 2026 benchmarks, for example 63% on Terminal-Bench 2.0 with GPT-5.2 and 42.50% on cross-repository changes (WideSWE), but it trailed Claude Code or OpenCode on others, and hard multimedia and research tasks stayed low (16.2-26.8%). In field studies of public GitHub pull requests, cloud Codex pull requests had the highest acceptance rates of the agents compared (64% and 59.6-88.6%). Out-of-scope actions on benign tasks were measured at 5.4-13.5%. Seven CVEs affecting Codex CLI or the desktop app have been published; fixes are referenced for most. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 60
  disputes: 55
  adherence_to_limits: 45
  evidence_quality: 85
overall_score: 62
evidence_grade: A
independent_source_count:
  performance: 26
  peer_reviewed: 5
  other: 9
factor_notes:
  completion_rate: 'Terminal-Bench 2.0: Codex CLI + GPT-5.2 63%, the highest average. TerminalWorld: 48.5% pass with GPT-5.5. WideSWE (v0.147.0): 42.50%, the best of seven. TEBench: highest composite (72.3%). SWE Atlas: GPT-5.4 in Codex 43.49% pass@1, the highest. SWE-Duel: ranked first. Timeline-Bench (0.155.1): 26.8%, the best of 16. BountyBench: patched 90%, detected 12.5%. Lower than Claude Code or OpenCode on SWE-RPG (28.5% vs 32.8-33.0%), RuBench (66.7% vs 78.7%) and ResearchClawBench (18.4 vs 21.5 of 100). MMTB 16.2%. Field studies: cloud Codex pull requests accepted at 64% (AIDev) and 59.6-88.6% by task type (MSR 2026), the highest of the agents compared.'
  disputes: Seven CVEs affecting Codex CLI or the desktop app (2025-2026), including sandbox and approval bypasses and commands run from project configuration (CVSS 4.1-9.8). One is a GitHub advisory patched in 0.39.0; the 2026 CVEs were published by OpenAI with fix pull requests referenced. No legal or regulatory action specific to Codex was found.
  adherence_to_limits: 'Overeager Coding Agents (0.90.0): out-of-scope actions on benign tasks 5.4-13.5% for Codex CLI, lower than Claude Code but higher than OpenHands. SNARE (0.57.0): 11.2% of runs. ABTest: anomaly rates up to 59.9% with a small model. MT-Sec: correct-and-secure output fell from 50.1% to 29.0% in a multi-turn setting. HarnessSecurity-Bench: protection from security settings varied. CVEs include approval and sandbox bypasses.'
  evidence_quality: Twenty-six independent sources, five peer-reviewed (NeurIPS 2025, ICLR 2026, MSR 2026, EMNLP 2026, ASE 2026 extended abstract). Recent tests state versions (0.144.0 in July 2026, v0.147.0 and 0.155.1 in September 2026), so grade A. Most sources are preprints, and several have funding or competitor disclosures.
