name: GitHub Copilot coding agent
slug: github-copilot-coding-agent
category: Coding agent
type: 'Cloud coding agent from GitHub (Microsoft): assigned an issue or task, it works in a GitHub Actions environment and opens a pull request for review; proprietary; runs models chosen by GitHub or the user'
homepage: https://docs.github.com/en/copilot/concepts/agents/coding-agent
scope: The cloud Copilot coding agent that opens pull requests (public preview May 2025; pull requests authored as copilot-swe-agent). Copilot code completions, Copilot Chat and agent mode in the IDE, Copilot CLI, Copilot code review, and the 2021 Codex-era Copilot studies are not covered.
summary: GitHub Copilot coding agent is a cloud agent from GitHub that takes an assigned issue, works in a GitHub Actions environment and opens a pull request for human review. Twelve independent field studies of its public GitHub pull requests were found (five peer-reviewed), all drawn from 2024-2025 activity. Acceptance rates ranged from 35% to 68.0% and were the lowest or near the lowest of the five agents compared in most studies; Copilot pull requests also drew the most reviews. No benchmark test of the cloud agent by independent researchers was found, and no study states a version. No CVE naming the cloud agent was found; CVEs for Copilot in IDEs and Copilot CLI are outside this entry. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 45
  disputes: 60
  adherence_to_limits: 50
  evidence_quality: 75
overall_score: 57
evidence_grade: B
independent_source_count:
  performance: 12
  peer_reviewed: 5
  other: 6
factor_notes:
  completion_rate: 'Field studies of public pull requests: Copilot acceptance 35% (AI Teammates), 42.4% for fix-related work, 43.04%, 49.60% for security work, 50% for performance fixes, 55.0%, 59.6% estimated, and 68.0% in the common May-July 2025 window (MSR 2026). It was the lowest or near the lowest of the five agents in most comparisons (Codex usually highest). Its CI/CD changes merged more often than its other changes (+15.63 points). No independent benchmark of the cloud agent was found.'
  disputes: No CVE naming the cloud coding agent and no legal or regulatory action specific to it was found. About 25 CVEs name Copilot in IDEs, Copilot Chat or Copilot CLI (outside this entry). The 2022 Copilot litigation concerns code completions (outside this entry).
  adherence_to_limits: 'Works only through pull requests that a human must approve. Trust but Verify?: Copilot pull requests carried a security smell most often (45.5%). Copilot pull requests drew the most reviews and change requests; Copilot made about 95% of the follow-up fixes on its merged pull requests. No direct measure of out-of-scope actions by the cloud agent was found.'
  evidence_quality: Twelve independent sources, five peer-reviewed (four MSR 2026 papers and one Information and Software Technology article). All are field studies largely drawn from one dataset (AIDev) covering December 2024 to July 2025, so they are not independent samples, none states a version, and none is within 12 months. Grade B.
uncertainties:
- All counted sources are field studies, mostly of the same AIDev pull-request data from 2024-2025; the product and its default models have changed since.
- Acceptance rates depend on repository, task type and reviewer behaviour, not only on the agent.
- No version is stated in any study, and none tested the agent after July 2025.
- Copilot in IDEs and Copilot CLI have their own evidence and CVEs; they may need separate entries.
- Citation check incomplete — recheck later (Semantic Scholar was rate-limited; OpenAlex was used).
