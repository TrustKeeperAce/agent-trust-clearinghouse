name: Browser Use (open-source library)
slug: browser-use
category: browser/web agent
type: open source (MIT); commercial Cloud service not covered
homepage: https://github.com/browser-use/browser-use
summary: Browser Use is an open-source Python library (MIT licence) that lets a language model of the user's choice control a web browser to carry out tasks. Results depend heavily on the model used. In independent evaluations (Online-Mind2Web, COLM 2025; Princeton's Holistic Agent Leaderboard; CAP, COLM 2026; a 2026 preprint), success rates ranged from about 2–5% full success on hard cross-site tasks to 18–45% on live-website benchmarks, well below the vendor's own figures. Independent security studies (VPI-Bench, ICLR 2026; five preprints) found it often followed instructions hidden in web pages, could be misdirected when a page changed between check and action, and often revealed private facts through its actions, and a domain-restriction bypass (CVE-2025-47241) was fixed in version 0.1.45. The vendor's Cloud service is not covered. Overall score 51. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 40
  disputes: 50
  adherence_to_limits: 30
  evidence_quality: 85
factor_notes:
  completion_rate: 30.0% human-evaluated success on Online-Mind2Web with GPT-4o (Operator 61.3%); 18.3–40.0% across 12 models on Princeton HAL's Online-Mind2Web and 2.0–38.8% on its AssistantBench subset; 2.0–5.0% full success on CAP (late 2025); 45.0% on a WebVoyager/WebShop subset (Skim). Strongly model-dependent. Under controlled page problems (BreakingWeb, 2026), pass rates fell 17.9–27.6 points. Judgment call.
  disputes: No legal or regulatory action found. One GitHub-reviewed critical advisory (GHSA-x39x-9qw5-ghrf / CVE-2025-47241, CVSS 4.0 Medium at NVD/CNA), fixed in 0.1.45; a researcher-reported credential-exfiltration proof of concept had no CVE. Judgment call.
  adherence_to_limits: The library's only built-in restriction (allowed_domains) could be bypassed before 0.1.45. Visual prompt-injection attack success was 16.7–100% across five platforms and six models (VPI-Bench; 73.7–100% on Amazon); plan-injection attacks succeeded up to 63%. In a study of page changes between an agent's check and its action (Atomicity for Agents, Ohio State, preprint 2026), the vulnerability was triggered in 9 of 14 cases for Browser Use. With Browser Use 0.13.1, agents revealed a private fact through their actions in 61.1% of sessions despite an instruction not to (AgentTell, 2026); an earlier version (0.7.7) lacked phishing and certificate warnings and accepted cookie and notification requests by default (Privacy Practices, 2025). Judgment call.
  evidence_quality: 'Eleven independent performance sources (five task-performance, six security or privacy), three peer-reviewed (COLM 2025, COLM 2026, ICLR 2026). AgentTell (2026) states the library version tested (0.13.1) on an August 2026 run, so the A condition of a current-version test within 12 months is met; grade A. The factor score is unchanged, so the overall score stays 51. Judgment call.'
overall_score: 51
overall_note: 0.30*40 + 0.20*50 + 0.25*30 + 0.25*85 = 50.75, rounded to 51
evidence_grade: A
