name: STORM / Co-STORM (knowledge-storm library)
slug: storm
category: Research
type: open source (MIT), PyPI knowledge-storm; Stanford hosted research preview (storm.genie.stanford.edu) not covered
homepage: https://github.com/stanford-oval/storm
scope: The open-source knowledge-storm library (v1.0.0 to 1.1.1, Sept 2024 to Sept 2025), covering the STORM (automatic) and Co-STORM (human-in-the-loop) modes, run with a language model and search engine chosen by the user. The 2024 NAACL code branch is historical context. The hosted research preview is not covered.
summary: 'STORM is an open-source research system from Stanford''s OVAL lab. It writes Wikipedia-style articles with citations by searching the web, simulating expert conversations and drafting an outline. Co-STORM adds a mode where a human takes part in the conversation. Results depend on the language model and search engine used. In seven independent evaluations (five peer-reviewed: EMNLP 2025 x2, ACL 2025, ACL 2026, ACL 2026 Findings), STORM produced complete cited articles but usually ranked below newer research systems. About 66-77% of citations supported the claims in one Wikipedia-generation study, and it scored 32.8-35.3 on DeepResearch Bench (50 = parity with the reference report). Co-STORM was tested in three of these studies with similar or lower results. The code has not changed since September 2025, and a July 2025 security report about disabled certificate checking remains unanswered. Overall score 56. Informational only; not a guarantee, endorsement, or certification.'
scores:
  completion_rate: 50
  disputes: 55
  adherence_to_limits: 45
  evidence_quality: 75
factor_notes:
  completion_rate: 'STORM reliably produces full cited articles, but quality trails newer systems. LLM-judge rubric scores: 4.30-4.76 of 5 with GPT-4o and Claude 3.5 (WriteHERE); 2.42-4.34 of 5 across backbones (OmniThink). Relative score 0.32-0.34 where 0.50 means parity with a human or Gemini Deep Research reference (CogGen). DeepResearch Bench RACE 32.81 (Qwen3-32B) and 35.26 (DeepSeek-V3.2), lowest of the multi-agent baselines (ScaffoldAgent). Answer coverage 72.0%, lowest of six systems (MySQA). DeepScholar-Bench geometric mean .073 (OpenAI Deep Research .309; human .782). Co-STORM: similar or lower in OmniThink, WriteHERE and CogGen. Judgment call.'
  disputes: 'No legal, regulatory or Wikipedia-community action found. A public GitHub issue (#375, 1 July 2025) reported an improper certificate validation problem and asked for a private disclosure channel; there has been no maintainer reply. The current code downloads web pages with certificate verification disabled (verify=False). No CVE was found. The project is active but dormant: no code changes since 30 Sep 2025 (last release 1.1.1), and 111 issues are open. Judgment call.'
  adherence_to_limits: Citation grounding is partial. Citation recall 77.49% / 67.72% and precision 75.71% / 66.50% on FreshWiki / WikiStart (MOG). Citation precision 73.3% and recall 64.7% (MySQA). DeepScholar-Bench citation precision .238 and claim coverage .586 with Llama-4. DeepResearch Bench citation accuracy 36.90% / 38.59% (ScaffoldAgent). Searches are limited to the configured retriever; no safety or prompt-injection tests were found. Judgment call.
  evidence_quality: Seven independent performance sources, five peer-reviewed, three published in 2026. All are by authors of competing systems or benchmarks (disclosed). Most use LLM judges and relative scores. None states the library version except WriteHERE (v1.1.0, 2025), so the A condition of a current-version test within 12 months is not met (grade B under the 0025 clarification). Judgment call.
overall_score: 56
overall_note: 0.30*50 + 0.20*55 + 0.25*45 + 0.25*75 = 56.00, so 56
evidence_grade: B
