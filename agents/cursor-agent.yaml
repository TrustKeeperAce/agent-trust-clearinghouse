name: Cursor agent
slug: cursor-agent
category: Coding agent
type: Coding agent from Anysphere inside the Cursor editor (agent mode), as background or cloud agents that open pull requests, and as a command-line agent; proprietary; runs models chosen by the user or by Cursor (including Cursor's own Composer models)
homepage: https://cursor.com/docs
scope: 'Cursor''s agent features from January 2025: agent mode in the editor, background and cloud agents (pull requests on cursor/ branches), and the Cursor CLI agent. Tab completion, inline edits (Cmd-K), chat-only use, Bugbot code review, the 2024 Composer before agent mode, and whole-product adoption studies are not covered.'
summary: 'Cursor''s agent works inside the Cursor editor, as cloud agents that open pull requests, and from the command line. Nineteen independent sources were counted (ten peer-reviewed). Fourteen are field studies of public GitHub pull requests from 2025, mostly drawn from one dataset (AIDev): Cursor acceptance was usually second or third of five agents (about 64-77%), lower for performance fixes (42%), and CI runs on its pull requests failed more often than for Copilot or Codex. In benchmarks, Cursor v2.3 tied the highest result on an iOS benchmark (12%) and Cursor Agent ranked first on one GPU-kernel task set. Security tests found prompt-injection and misuse exposure, reduced in newer versions. 28 CVEs (2025-2026) concern agent features; fixes are listed. Informational only; not a guarantee, endorsement, or certification.'
scores:
  completion_rate: 55
  disputes: 45
  adherence_to_limits: 40
  evidence_quality: 85
overall_score: 57
evidence_grade: A
grade_note: 'Grade A: 19 counted sources (10 peer-reviewed), including versioned tests within 12 months (Cursor v3.3.30 in an ISSTA 2026 study; Cursor v2.3 in a KDD 2026 benchmark). Fourteen counted sources are field studies largely drawn from one dataset (AIDev, 2025), so they are not independent samples.'
independent_source_count:
  performance: 19
  peer_reviewed: 10
  other: 17
factor_notes:
  completion_rate: 'Pull-request field studies (2025): Cursor acceptance 74.5% (74.4% in the common window, second to Codex 79.9%), 74.6%, 76.47% for security work, 68.4% for fixes, 65.22%, 63.9% estimated, 0.67 average, 51.4%, and 42% for performance fixes; CI runs on its pull requests succeeded 65-73% (Copilot and Codex about 93%). Benchmarks: SWE-Bench Mobile 12% with Cursor v2.3 (tied highest of 22 configurations; low in absolute terms); AgentKernelArena first on Triton-to-Triton with Opus 4.7. Results depend strongly on the model chosen.'
  disputes: 28 CVEs (2025-2026) concern agent features, CVSS 4.4-9.8 (four at 9.6 or above, including 2026 sandbox escapes); all were published by Cursor through GitHub advisories with fixed versions. In July 2025 Cursor apologised for a June 2025 pricing change and offered refunds. No filed legal or regulatory action specific to the agent was found.
  adherence_to_limits: 'Security tests: malicious issue requests succeeded in 66.5% of runs in auto-run mode (41.1% with Sonnet 4.6); Cursor IDE completed 39.19% of attack-technique misuse requests (Cursor CLI 62.16%); tool-hijacking reached code execution on older releases but at most 0.3 on v3.3.30. Several CVEs are allowlist, sensitive-file or sandbox bypasses, since fixed. One reported incident (2026) of a destructive database deletion. Field data show low security-smell rates in two studies and near-average in another.'
  evidence_quality: Nineteen independent sources, ten peer-reviewed (seven MSR 2026 papers, Information and Software Technology, ISSTA 2026, KDD 2026), with versioned tests within 12 months. Fourteen are field studies largely from one dataset (AIDev, 2025), so they are correlated; benchmarks are few and model-dependent. Grade A.
uncertainties:
- Fourteen counted sources are field studies drawn largely from the same AIDev pull-request data (2025), so they are not independent samples; as for other coding-agent entries, each study counts once.
- Field studies identify Cursor pull requests by cursor/ branch names, which mainly capture background or cloud agents, not agent mode inside the editor.
- Results depend heavily on the model chosen inside Cursor; benchmark figures describe agent and model together.
- Cursor releases change often (about v1.0 to v3.x during 2025-2026); most field studies state no version.
- Two competitor-authored comparisons and one whole-product adoption study are listed but not counted.
- Citation check incomplete — recheck later (Semantic Scholar rate-limited and the arXiv API unavailable; OpenAlex used; several MSR 2026 papers not screened).
