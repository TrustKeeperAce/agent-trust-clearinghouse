name: Loki (Libr-AI OpenFactVerification, open-source)
slug: loki
category: Verification
type: Open-source fact-verification tool (MIT licence), Libr-AI; GitHub Libr-AI/OpenFactVerification; not on PyPI
homepage: https://github.com/Libr-AI/OpenFactVerification
scope: The open-source Loki library/CLI/web app (v0.0.1 April 2024 to v0.0.3 May 2024, main branch to October 2024), run with a language model (OpenAI, Anthropic or local) and search API (Serper or Google) chosen by the user. The hosted demo (loki.librai.tech) is not covered.
summary: Loki is an open-source fact-checking tool from Libr-AI (an MBZUAI-linked group). It splits text into claims, checks which are worth verifying, searches the web for evidence and gives a verdict for each claim, with the evidence shown so a person can judge. Two independent studies ran Loki as a comparison system. On FacTool-KBQA it reached F1 0.76 on non-factual and 0.67 on factual claims (Proof-of-Guardrail, USC/Sahara AI). Adapted to health claims in TikTok influencer videos, it reached macro-F1 0.43 (TAIGR, Purdue). The developers' own figures from their COLING 2025 demo paper are not counted. The repository has had no code changes since June 2024 and the hosted demo did not respond on 17 October 2026. No CVEs or security advisories were found. Insufficient evidence for an overall score. Informational only; not a guarantee, endorsement, or certification.
scores: null
overall_score: null
evidence_grade: Insufficient evidence
independent_source_count:
  performance: 2
  other: 3
factor_notes:
  completion_rate: 'Proof-of-Guardrail (FacTool-KBQA, Loki as a guardrail): non-factual claims precision 0.71 / recall 0.81 / F1 0.76; factual claims 0.74 / 0.61 / 0.67. TAIGR (influencer health-claim validation, Loki adapted to PubMed evidence with GPT-4.1-mini): macro-F1 0.43 (Incorrect 0.71, Partially correct 0.29, Correct 0.29), below TAIGR''s 0.52. Developer-reported (not counted): F1 0.84 / 0.63 on Factcheck-Bench and 0.85 / 0.60 on FacTool-QA. Not scored.'
  disputes: 'None found: no CVEs, no GitHub security advisories, no legal or regulatory action. Not scored.'
  adherence_to_limits: No independent tests of robustness or misuse found. Proof-of-Guardrail reports Loki added about 28% latency (20.4 s vs 16.0 s mean) when run inside a trusted execution environment. Not scored.
  evidence_quality: Two independent performance sources (both 2026 preprints, unrelated groups), below the three-source minimum. Both used the open-source code after its last code change. Not scored.
