uncertainties:
- 'Semantic Scholar citation check rerun 19 Oct 2026 (Decision 0077): still 27 citing papers; two independent tests found. Two other papers used Loki as a tool without measuring its accuracy; this says nothing about how well Loki works. Five papers without open full text were checked by abstract only.'
- TAIGR tested Loki on a task it was not designed for (implicit influencer takeaways); Proof-of-Guardrail's main subject is attestation, not Loki.
- Results would depend on the model and search API chosen.
- The hosted demo did not respond on 17 October 2026; whether it is retired is unknown.
