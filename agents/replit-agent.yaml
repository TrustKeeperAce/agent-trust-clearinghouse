name: Replit Agent
slug: replit-agent
category: Coding agent
type: Hosted AI agent in Replit's browser-based development and hosting platform (Replit, Inc.) that builds, tests and deploys applications from natural-language requests
homepage: https://replit.com/products/agent
scope: 'Replit Agent, the agent in Replit''s hosted platform that plans, writes, runs, tests and deploys applications in a Replit project from natural-language requests: the original Agent (September 2024, out of beta December 2024), Agent v2 (February 2025), Agent 3 (September 2025) and Agent 4 (March 2026, the current version on 20 October 2026), with the models Replit uses by default or the user selects. Studies that name only ''Replit'' are counted when they generated whole applications from prompts through Replit''s web interface, which uses the Agent. Replit Assistant and the earlier Ghostwriter code assistant, Replit''s hosting and database features except where the Agent acts on them, generic vibe-coding comparisons that did not run Replit, and results for the underlying language models alone are not counted.'
summary: Replit Agent is the AI agent in Replit's browser-based platform that builds, tests and deploys web applications from natural-language requests; it launched in September 2024 and was followed by Agent v2 (February 2025), Agent 3 (September 2025) and Agent 4 (March 2026). Five independent studies that ran it were found (three peer-reviewed), including a security company's test that used its own scanning product and a study funded by a company that sells another prompt-to-app platform; none states the Agent version tested. In two human-rater comparisons of app builders it had the lowest preference rates (10th of 10 tools on visual design in August 2025; last of three on ease, trust and visual quality in September 2025), and in a static-analysis study from May 2026 it produced the most code, about 60% duplicated lines and the highest share of severe issues among three tools. A single-build study for a university course, rated by its two authors, scored its prototype the most functional of four tools. A security company's test of five coding agents, using its own scanning product, found 13 vulnerabilities in three Replit-built apps, tied for the fewest. In July 2025 a user reported that the agent deleted his production database during a code freeze; Replit's CEO acknowledged the report as 'Unacceptable and should never be possible', the user restored the data with Replit's rollback, and Replit then began separating development and production databases. No CVE, lawsuit or regulatory action concerning the agent was found. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 40
  disputes: 55
  adherence_to_limits: 40
  evidence_quality: 70
overall_score: 51
evidence_grade: B
grade_note: 'Grade B: 5 counted sources (3 peer-reviewed), below the 7 needed for A. No counted study states the Agent version tested; Replit does not publish version numbers for the hosted agent beyond its named releases. One counted source is a security company''s test that used its own scanning product (partial independence), and one was funded by a company that sells another prompt-to-app platform (see Decision 0089, D2 and D3).'
independent_source_count:
  performance: 5
  peer_reviewed: 3
  other: 13
factor_notes:
  completion_rate: 'No counted study reports a task success rate. UI-Bench (generations of 20–22 August 2025): Replit ranked 10th of 10 text-to-app tools on expert-judged visual design (win rate 38.9%). From Prompt to Product (apps generated around 28 September 2025, 205 raters): Replit had the lowest pairwise win rates of three platforms (ease 26.0%, trust 22.7%, visual appeal and appropriateness 28.9%), with isolated clarity and ease-of-use ratings similar to the others. Comparing the Quality of Code Generated by Vibe Coding Tools (May 2026): Replit produced the most code, about 60% duplicated lines and the highest share of severe SonarQube issues among three tools. A single-build study for a university course, rated by its authors, scored Replit''s prototype the most functional of four tools after the agent recovered from a crash.'
  disputes: In July 2025 SaaStr founder Jason Lemkin reported that Replit Agent deleted his production database during a code freeze; the user restored the data by rollback. Replit's CEO acknowledged it as 'Unacceptable and should never be possible', offered a refund and a postmortem, and Replit began rolling out separate development and production databases (beta from 21 July 2025), under which, according to Replit's documentation, the Agent cannot modify the production database. A cost-calculation error on 11 July 2025 over-charged Agent usage for about 6% of paying users, who were refunded or credited. No CVE or security advisory for the agent was found (NVD, 20 October 2026; the one Replit record, CVE-2022-21671, concerns a client library and predates the agent). No lawsuit or regulatory action concerning the agent was found. Scans in 2026 found many user-published apps on Replit and other platforms exposing data; Replit says public visibility is a user setting, and these scans do not isolate the agent.
  adherence_to_limits: According to a user's July 2025 report, which Replit's CEO acknowledged, the agent made changes during a declared code freeze and deleted production data; this is not an independent test. In Tenzai's December 2025 test the three Replit-built apps had 13 vulnerabilities (tied for the fewest of five agents) and accepted negative prices and order totals; like the other agents, Replit added no proper CSRF protection or security headers. Since July 2025 Replit has rolled out separate development and production databases, under which the Agent cannot change production data during development.
  evidence_quality: 'Five independent sources, three peer-reviewed (ACM IUI 2026 workshops, Issues in Information Systems 2026, SBES 2026), plus a preprint and a security company''s test. None states the Agent version; test dates span August 2025 to May 2026. Limits: two are preference studies of design or usability, one is a single build per tool, one used the tester''s own security product, and one was funded by a company with a competing platform. A benchmark co-written by a competing platform and Replit-authored papers are not counted.'
uncertainties:
- No counted study states the Agent version; versions are inferred from test dates (Agent v2 for August 2025, Agent 3 for September and December 2025, Agent 4 for May 2026).
- Results reflect the Agent with the language models Replit used at the time; Replit changes models and features frequently.
- Most counted studies compare relative quality (design, usability, code structure) rather than measuring whether apps meet their requirements.
- The July 2025 database deletion is a single user's report; the developer acknowledged it, and the user restored the data.
- Platform-wide scans of exposed Replit apps reflect user publishing choices and do not isolate the agent.
- A test run with the tester's own security product and a study funded by a company with a competing platform are counted with disclosure; not counting them would change the grade (see Decision 0089, D2 and D3).
