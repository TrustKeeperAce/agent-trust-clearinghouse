  evidence_quality: null
factor_notes:
  Completion rate: 'Independent evidence on correctness is limited: one peer-reviewed comparison run with code execution disabled, and one single-prompt observation.'
  Disputes: No lawsuits, regulatory actions, or data-protection complaints concerning Julius AI were found.
  Adherence to limits: The vendor states credit-based usage limits and file-retention periods; not independently tested.
  Evidence quality: Fewer than three independent evaluations of computed answers; other evidence is vendor statements, competitor benchmarks, and anecdotal reports.
