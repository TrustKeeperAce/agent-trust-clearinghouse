name: Julius AI
slug: julius-ai
category: Simple analysis
type: commercial
homepage: https://julius.ai/
scope: AI data-analysis agent
summary: Julius AI is a commercial AI data-analysis tool that generates and runs code from natural-language prompts. Four limited independent evaluations were found. A 2026 peer-reviewed study found high accuracy on text-based statistics questions (86.49% on a statistical-literacy test; 78.6% on statistical data questions) and lower accuracy on causal questions and items needing figures. Two education studies from one research group found errors on a PDF math worksheet and a multiplication prompt, and a peer-reviewed comparison tested Julius with code execution disabled. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 55
  disputes: 80
  adherence_to_limits: 50
  evidence_quality: 55
factor_notes:
  completion_rate: 'Quality & Quantity (2026; peer-reviewed): 32 of 37 statistical-literacy (BLIS) items correct (86.49%), all five errors on items that needed a plot or figure; QRDATA statistical 88/112 (78.6%), social science 20/35 (57.1%), causal 144/264 (54.5%); MathBench probability and statistics subdomains 43.7-100%. IJRSI (2026; February 2025 test): on a nine-question NAEP grade-12 mathematics PDF, Julius identified 4 of the 9 questions, left 5 unanswered and got 0 of 5 multiple-choice answers correct. Ohio Journal of School Mathematics (2025): one multiplication prompt. Applied Sciences (2026): comparison run with code execution disabled. Judgment call.'
  disputes: No lawsuits, regulatory actions, or data-protection complaints concerning Julius AI were found. Judgment call.
  adherence_to_limits: The vendor states credit-based usage limits and file-retention periods; not independently tested. The Quality & Quantity study observed that Julius shifted modelling strategies across prompts and initially proposed overly simple specifications. Judgment call.
  evidence_quality: 'Four independent performance sources, two peer-reviewed (Quality & Quantity 2026; Applied Sciences 2026). Two are education studies by one research group, one in a venue whose review could not be confirmed; one comparison ran with code execution disabled; none states a dated version of the 2026 product; the vendor gave complimentary access for one study (disclosed). Judgment call.'
