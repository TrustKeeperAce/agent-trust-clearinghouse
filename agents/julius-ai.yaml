  disputes: No lawsuits, regulatory actions, or data-protection complaints concerning Julius AI were found.
  adherence_to_limits: The vendor states credit-based usage limits and file-retention periods; not independently tested.
  evidence_quality: Fewer than three independent evaluations of computed answers; other evidence is vendor statements, competitor benchmarks, and anecdotal reports.
