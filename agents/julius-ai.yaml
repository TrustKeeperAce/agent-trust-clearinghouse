uncertainties:
- No independent study found tests Julius as normally used, with code execution enabled.
- The peer-reviewed comparison contains internal inconsistencies in its stated test dates and software versions.
- Benchmarks published by competing products are not independent.
- Privacy, retention, training-use, and compliance statements are vendor statements and were not independently verified.
- The product and its billing model changed in 2026; older evidence may not reflect the current product.
