  kind: other
  accessed: '2026-10-17'
  note: 'Brave (competing browser maker), Oct 2025: asking Fellou to navigate to a page with visible instructions led it to follow them (demonstration: open Gmail, send the latest subject line to another site). Reported 20 Aug 2025, published 21 Oct 2025; fix status not stated'
- url: https://www.theregister.com/software/2025/10/28/ai-browsers-wide-open-to-attack-via-prompt-injection/327406
  kind: other
  accessed: '2026-10-17'
  note: 'The Register (28 Oct 2025): reporter reproduced a similar hidden-text instruction against Fellou; the same test did not work on Comet or Atlas. Single informal test'
