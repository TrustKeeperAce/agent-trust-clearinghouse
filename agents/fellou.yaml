  kind: other
  accessed: '2026-10-17'
  note: 'LayerX BioShocking (security vendor): a game-framed page led all six agents tested, including Fellou, to retrieve and share credentials from a test repository. Reported to Fellou 30 Oct 2025; status "no response"'
