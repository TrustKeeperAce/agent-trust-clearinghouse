uncertainties:
- 'Semantic Scholar citation (CAP) and keyword checks were completed on 17 Oct 2026 and found no Fellou test; its full-text snippet search could not be run (rate-limited).'
- 'Whether to exclude CAP for Fellou (vendor-affiliated author) is a judgment call; even if counted, Fellou would have 1 source, so the outcome does not change.'
- 'Fellou updates continuously without public version numbers after 2.0; the version tested by each source is not known.'
- 'Informal hands-on reviews (Zapier, TheToolNerd, meshedsociety, a personal blog) describe instability and failures on complex pages but are not systematic and are not counted.'
- 'Fix status of the Brave and LayerX findings is unknown.'
