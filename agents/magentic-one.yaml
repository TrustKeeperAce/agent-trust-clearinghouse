  note: 'AgentX (Indian Institute of Science, IBM India Research Lab; preprint, September 2025): compares the authors'' pattern with ReAct and a Magentic-One pattern in AutoGen whose default agents were replaced by one agent per MCP server (''we adapt this architecture by replacing the default agents''); Magentic-One scored lower on a stock-correlation task and had a mean framework latency of 30.1 s. Adapted configuration (0042), listed as other (see D2)'
