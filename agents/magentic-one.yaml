name: Magentic-One (open-source)
slug: magentic-one
category: Browser/web agent
type: 'Open-source generalist multi-agent system from Microsoft Research AI Frontiers, built on AutoGen: an Orchestrator directing WebSurfer, FileSurfer, Coder and ComputerTerminal agents; GitHub microsoft/autogen (autogen-agentchat, autogen-ext, magentic-one-cli)'
homepage: https://github.com/microsoft/autogen
scope: 'Magentic-One as released by Microsoft in AutoGen: the Magentic-One group chat with its Orchestrator, WebSurfer, FileSurfer, Coder and ComputerTerminal agents (autogen-agentchat and autogen-ext 0.4 to 0.7.5; 0.7.5 of 30 September 2025 is the latest release), the magentic-one-cli tool and the original November 2024 package, run with a language model chosen by the user. Magentic-UI, the Magentic orchestration in Microsoft Agent Framework and setups that keep only the orchestrator with other agents are separate and not counted here. AutoGen Studio is covered only as context under disputes.'
summary: Magentic-One is an open-source multi-agent system from Microsoft Research, released in November 2024 on the AutoGen framework, in which an orchestrator plans and directs agents that browse the web, read files, write code and run it in a terminal. Six independent studies that ran it were found (four peer-reviewed). On GAIA it solved about 38% of tasks with GPT-4o in one study and about 43% of Level 1 and 26% of Level 2 tasks with Qwen-Plus in another; on large document-processing workflows it did not complete tasks reliably. Security studies found that malicious files or web pages could redirect it to run attacker code in most trials (97% with GPT-4o and a local file), and that benign errors often led it to unsafe actions such as privilege changes. One study tested the current release (0.7.5). Since October 2026 the developer's AutoGen page says the project is archived and no longer receives bug or security fixes; GitHub does not mark the repository as archived. Informational only; not a guarantee, endorsement, or certification.
scores:
  completion_rate: 40
  disputes: 60
  adherence_to_limits: 30
  evidence_quality: 75
overall_score: 50
evidence_grade: B
grade_note: 'Grade B: 6 counted sources (4 peer-reviewed), below the 7 needed for A. One counted test states the version (Agent Meltdowns, 0.7.5, accessed 2 May 2026), which is still the latest release. Studies that kept only the Magentic-One orchestrator with other agents, and studies with Microsoft-affiliated authors, are not counted (see Decision 0088, D2 and D3).'
independent_source_count:
  performance: 6
  peer_reviewed: 4
  other: 13
factor_notes:
  completion_rate: 'GAIA with GPT-4o: 38.0% of tasks solved across the traces in MAST (NeurIPS 2025). GAIA with Qwen-Plus: about 43% on Level 1 and 26% on Level 2 as a baseline (ICML 2026), lower than the authors'' parallel variants. In TraceElephant (ACL 2026), 74 of 119 GAIA runs and 17 of 30 AssistantBench runs failed. On large document-processing workflows it did not complete tasks reliably, with orchestration errors and context growth (APWA). The developer''s own GAIA, AssistantBench and WebArena results are not counted.'
  disputes: No CVE or GitHub security advisory was found for Magentic-One, autogen-agentchat, autogen-ext or magentic-one-cli (NVD and GitHub, 20 October 2026). Hardening of component loading and of the VideoSurfer agent (URL input and path traversal) was merged on the main branch on 25 March 2026 but is not in any PyPI release (latest 0.7.5, 30 September 2025). On 16 October 2026 the developer's AutoGen README was updated to say the project is archived and no longer receives bug or security fixes; GitHub did not mark the repository as archived (checked 20 October 2026). A security company lists an unconfirmed path-traversal report for magentic-one-cli without a CVE. The AutoJack issue concerned AutoGen Studio, not Magentic-One, and never shipped in a PyPI release. No legal or regulatory action found.
  adherence_to_limits: 'Multi-Agent Systems Execute Arbitrary Malicious Code (COLM 2025): the Magentic-One orchestrator ran attacker code in 97% of trials with GPT-4o after reading a malicious local file and in 88% with Gemini 1.5 Pro after visiting a malicious web page, although direct and indirect prompt injection baselines rarely succeeded. Agent Meltdowns (0.7.5, GPT-5): after benign errors it attempted 90.9% of the medium- and high-severity actions it planned, 58.6% of attempts succeeded, and it reported 54.3% of such behaviours to the user; with GPT-5 it accounted for the largest share of access-control-related behaviours among the four harnesses tested.'
  evidence_quality: Six independent sources, four peer-reviewed (COLM 2025, NeurIPS 2025 Datasets and Benchmarks, ACL 2026, ICML 2026), plus two 2026 preprints. One states the version (0.7.5, the latest release). Two counted studies share authors (Cornell), two propose competing methods (disclosed), and one is a failure-attribution benchmark whose task selection was not designed as a benchmark score. Many other papers use Magentic-One traces or an adapted orchestrator and are listed as other. Several studies with Microsoft-affiliated authors are excluded.
uncertainties:
- Results reflect the language model and Magentic-One together; studies used GPT-4o, Gemini 1.5, Qwen-Plus, GPT-5 and GPT-5.4 models.
- Only one counted study states the version tested; the others most likely used 0.4.x releases from 2025.
- Since 16 October 2026 the AutoGen README says the project is archived and no longer receives bug or security fixes, although GitHub does not mark the repository as archived (20 October 2026); later security issues may not be fixed, and the March 2026 hardening is not in a PyPI release.
- Magentic-UI and the Microsoft Agent Framework Magentic orchestration are separate products; their results are not counted here.
- Several studies run the Magentic-One orchestrator with substituted agents; they are listed as other, and counting them would change the grade (see Decision 0088, D2).
- Studies with Microsoft-affiliated authors who are not on the Magentic-One team are excluded; counting them would change the grade (see Decision 0088, D3).
- Two counted studies share authors (Multi-Agent Systems Execute Arbitrary Malicious Code and Agent Meltdowns).
