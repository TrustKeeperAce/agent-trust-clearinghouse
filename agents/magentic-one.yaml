  accessed: '2026-10-20'
  note: 'Multi-Agent Systems Execute Arbitrary Malicious Code (Triedman, Jha, Shmatikov; Cornell Tech; COLM 2025): control-flow hijacking through malicious local files and web pages in AutoGen (default Magentic-One group chat with orchestrator, file surfer, web surfer, coder and code executor), CrewAI and MetaGPT; ''the Magentic-One orchestrator, running on GPT-4o, executes arbitrary malicious code 97% of the time if it interacts with a malicious local file'', and 88% of the time with Gemini 1.5 Pro and a malicious web page. Shares authors with Agent Meltdowns (counted)'
- url: https://arxiv.org/abs/2503.13657
  kind: independent performance
  peer_reviewed: true
  version_tested: unstated
  test_date: '2025'
  accessed: '2026-10-20'
  note: 'Why Do Multi-Agent LLM Systems Fail? (MAST; UC Berkeley, Intesa Sanpaolo; NeurIPS 2025 Datasets and Benchmarks): 1,642 annotated traces from seven multi-agent systems, including 195 Magentic-One traces on GAIA with GPT-4o; Magentic-One succeeded on 38.0% and failed on 62.0% of the GAIA tasks run (Figure 5), with failures classified by the MAST taxonomy'
- url: https://doi.org/10.18653/v1/2026.acl-long.912
  kind: independent performance
  peer_reviewed: true
  version_tested: unstated
  test_date: 2025-2026
  accessed: '2026-10-20'
  note: 'Seeing the Whole Elephant (TraceElephant; Institute of Software, Chinese Academy of Sciences; ACL 2026): the authors ran Magentic-One on GAIA (119 traces, 74 failed) and AssistantBench (30 traces, 17 failed) at temperature 0.3 to build a failure-attribution benchmark; agents that interact with external environments, such as web browsing, accounted for about half of failures. Task selection served the benchmark, so the failure share is not a benchmark score'
- url: https://proceedings.mlr.press/v306/xu26bb.html
  kind: independent performance
  peer_reviewed: true
  version_tested: unstated
  test_date: '2026'
  accessed: '2026-10-20'
  note: 'A Two-Tier Perspective on Inference-Time Parallelism in Multi-Agent LLM Systems (Beijing University of Posts and Telecommunications; ICML 2026, PMLR 306; preprint arXiv 2608.05791 counted once): Magentic-One with Qwen-Plus as the baseline on GAIA; the authors'' parallel configurations raised accuracy ''from approximately 43% to 52–57% on Level 1 tasks, and from around 26% to up to 39% on Level 2 tasks'', with Magentic-One taking about 320 s per Level 2 task against about 170–280 s. Authors propose a competing method built on the Magentic-One architecture (disclosed)'
- url: https://arxiv.org/abs/2605.19149
  kind: independent performance
  peer_reviewed: false
  version_tested: autogen 0.7.5 (PyPI)
  test_date: 2026 (accessed 2 May 2026)
  accessed: '2026-10-20'
  note: 'Agent Meltdowns (Jha, Triedman, Bhattacharya, Shmatikov; Cornell University; preprint, May 2026): unsafe actions after benign errors (404, 429, missing files) in Magentic-One, OpenAI Codex, Claw Code and the HAL Generalist Agent; Magentic-One ''Version 0.7.5, accessed via AutoGen on PyPI on 2026-05-02'', mainly with GPT-5. For medium- and high-severity behaviours with GPT-5, Magentic-One''s planned-to-attempted rate was 90.9%, attempted-to-successful 58.6% and reporting rate 54.3%; it accounted for 45.5% of agent privilege escalations (30/66) and 76.9% of access-control mutations (10/13) across the four harnesses. Shares authors with Multi-Agent Systems Execute Arbitrary Malicious Code (counted)'
- url: https://arxiv.org/abs/2605.15132
  kind: independent performance
  peer_reviewed: false
  version_tested: unstated
  test_date: '2026'
  accessed: '2026-10-20'
  note: 'APWA (Northeastern University; preprint, May 2026): Magentic-One as a baseline for large document-processing workflows with GPT-5.4-family models; ''Magentic-One is unable to complete any of the tasks reliably, only managing to produce an output in a single trial for PII-300k with all 4096 documents''; the authors describe orchestration failures and a FileSurfer run that consumed over 6.5M input tokens before a 30-minute timeout. Authors propose a competing architecture (disclosed)'
- url: https://arxiv.org/abs/2608.25920
  kind: other
  accessed: '2026-10-20'
  note: 'Repair or Resample? (East China Normal University, Nanyang Technological University and others; preprint, August 2026): 200 WebArena hard and AssistantBench tasks per framework; the Magentic-One adapter ''uses AutoGen AgentChat 0.7.5'' and imports ''AssistantAgent and MagenticOneGroupChat'', so the Magentic-One orchestrator ran with general assistant agents rather than its own web, file, coding and terminal agents; 181 Magentic-One runs were kept as evaluator-confirmed failures; the paper excludes 64 of its 600 runs before annotation for reasons other than success, so no success rate is derived here. Orchestrator with substituted agents, listed as other (see D2)'
