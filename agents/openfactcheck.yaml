uncertainties:
- Semantic Scholar citation check (17 Oct 2026) covered all papers citing the three OpenFactCheck papers; none ran OpenFactCheck as a tested system. An OpenAlex full-text recheck (Decision 0080, 19 Oct 2026) read 13 newer citing papers in full; none ran it either. Papers without open full text were checked by abstract only.
- OpenFactCheck is a framework that combines other checkers; "performance" depends on the configuration chosen.
- The 2.0 alpha series may be a substantial rewrite; continuity is unassessed beyond release history.
