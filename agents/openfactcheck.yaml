name: OpenFactCheck (open-source framework)
slug: openfactcheck
category: Verification
type: Open-source factuality framework (PyPI openfactcheck; repository licence AGPL-3.0, PyPI metadata says GPL-3.0), MBZUAI researchers; GitHub openfactcheck-research/openfactcheck
homepage: https://github.com/openfactcheck-research/openfactcheck
scope: 'The open-source OpenFactCheck library (PyPI 0.0.17 July 2024 up to 1.1.2; the 2.0 alpha series, 2.0.0a1 to 2.0.0a10 in 2026, is not assessed): CustChecker/ResponseEval (configurable fact-checker built from FacTool, Factcheck-GPT and other modules), LLMEval and CheckerEval. Run with user-chosen models and retrievers. The hosted web app is not covered.'
summary: OpenFactCheck is an open-source framework from MBZUAI researchers for building configurable fact-checkers, measuring how factual language models are, and benchmarking fact-checkers. Its fact-checking mostly reuses parts of earlier systems (FacTool, Factcheck-GPT). No independent evaluation that ran it was found; the only figures come from its developers' EMNLP 2024 demo and COLING 2025 papers. It is actively maintained (2.0 alpha releases in 2026). No CVEs or security advisories were found. Insufficient evidence for an overall score. Informational only; not a guarantee, endorsement, or certification.
scores: null
overall_score: null
evidence_grade: Insufficient evidence
independent_source_count:
  performance: 0
  other: 2
factor_notes:
  completion_rate: No independent results. Developer papers benchmark the component checkers (e.g. Factcheck-GPT with GPT-4 reaching false-claim F1 0.63 on Factcheck-Bench) rather than a single OpenFactCheck configuration. Not scored.
  disputes: 'None found: no CVEs, no GitHub security advisories, no legal or regulatory action. Licence metadata differs between the repository (AGPL-3.0) and PyPI (GPL-3.0). Not scored.'
  adherence_to_limits: No independent tests found. Not scored.
  evidence_quality: Zero independent performance sources; below the three-source minimum. Not scored.
