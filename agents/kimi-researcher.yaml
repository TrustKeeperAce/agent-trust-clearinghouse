scope: Moonshot AI's Deep Research mode in Kimi, powered by the Kimi-Researcher model (launched June 2025).
summary: Kimi Researcher is Moonshot AI's deep-research agent, offered as Deep Research in Kimi. Two independent evaluations were found. On DeepResearch Bench (mid-2025) its report quality was mid-tier, close to Claude Research and below OpenAI and Gemini deep research. On ICBCBench, a 2026 financial-research preprint, it ranked third among closed systems. Fewer than three independent sources were found, so no overall score is given. In April 2026 the Kimi app reportedly showed one user's résumé to another user. Insufficient evidence. Informational only; not a guarantee, endorsement, or certification.
