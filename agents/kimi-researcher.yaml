  evidence_quality: null
factor_notes:
  completion_rate: DeepResearch Bench RACE 44.64 (OpenAI DR 46.45, Claude Research 45.00); ICBCBench English overall 47.59 (Gemini DR 57.38, o3-deep-research 54.67), Chinese 44.72. DeepResearch Bench gave no citation-accuracy (FACT) score because Kimi's citations could not be parsed from the interface. A later re-scoring of the same reports by Microsoft authors (DualGraph preprint, February 2026, GPT-4.1 judge) reported 20.80% citation accuracy with 2.30 effective citations per task, the lowest of the systems listed; not counted (same reports, no new test), and the figure may reflect the same parsing problem rather than citation quality.
  disputes: 'April 2026: the Kimi app reportedly returned another user''s real résumé during an unrelated request (Kimi-wide, not specific to Deep Research); no official statement. No regulator action against Kimi found.'
  adherence_to_limits: Not independently tested.
  evidence_quality: Two independent performance sources (one peer-reviewed, one preprint with Alibaba co-authors). Vendor benchmark claims (HLE, xbench) excluded.
