factor_notes:
  completion_rate: DeepResearch Bench RACE 44.64 (OpenAI DR 46.45, Claude Research 45.00); ICBCBench English overall 47.59 (Gemini DR 57.38, o3-deep-research 54.67), Chinese 44.72. No citation-accuracy scores available.
  disputes: 'April 2026: the Kimi app reportedly returned another user''s real résumé during an unrelated request (Kimi-wide, not specific to Deep Research); no official statement. No regulator action against Kimi found.'
