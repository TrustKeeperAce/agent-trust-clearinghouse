  change_html: 'Added <a href="/agents/replit-agent.html">Replit Agent</a> (AI agent in Replit''s hosted platform that builds, tests and deploys apps from natural-language requests; Coding agent): overall 51, evidence grade B, 5 independent performance sources (3 peer-reviewed). No counted test states the Agent version. Replit-authored papers and a benchmark co-written by a competing platform are not counted; a security company''s test that used its own scanning product is counted with a partial-independence label, and a study funded by a company that sells another prompt-to-app platform (not itself tested) is counted with that disclosure. A user reported in July 2025 that the agent deleted his production database during a code freeze; Replit''s CEO acknowledged the report, the user restored the data with Replit''s rollback, and Replit then began separating development and production databases. The report is described under disputes and is not counted as a test. No CVE, lawsuit or regulatory action concerning the agent was found. Citation check incomplete — recheck later.'
