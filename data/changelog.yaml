  change_html: 'Added <a href="/agents/google-jules.html">Google Jules</a> (Google''s asynchronous coding agent that works on a GitHub repository in a cloud virtual machine and returns pull requests; Coding agent): overall 50, evidence grade B-, 3 independent performance sources (none peer-reviewed). No counted source states the Jules version, and all predate the Gemini 3 updates. Google''s own posts and benchmark results and a paper by Google authors are not counted; a peer-reviewed study with a GitHub co-author that compares Jules with GitHub Copilot is listed but not counted. One counted study is in a journal whose review process could not be confirmed. An independent researcher''s 2025 prompt-injection demonstrations are described under disputes and adherence and are not counted as tests. No CVE, lawsuit or regulatory action concerning Jules was found. The <a href="/compare/coding-agents.html">coding agents comparison</a> now names Google Jules among the managed products. Citation check incomplete — recheck later.'
